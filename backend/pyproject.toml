[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "celery>=5.6.3",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=3.7.0",
    "orjson>=3.12.0",
    "pillow>=11.1.0",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "coverage>=7.16.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
    "scripts/run_data_pages_real_sync.py",
    "app/modules/integration_sync/data_pages_real_sync.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/20260917_0012_add_sample_and_refund_business_amounts.py" = ["E501"]
"app/modules/integration_sync/data_pages_business_rules.py" = ["E501", "I001", "UP035"]
"app/modules/integration_sync/data_pages_mart_refresh.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
