name: AI branch formatter (one-time)
on:
  push:
    branches:
      - integration/frontend-acceptance-ai-20261027
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Format and lint AI diff against repository Ruff rules
        working-directory: backend
        run: |
          uv run ruff format .
      - name: Commit only formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          if ! git diff --cached --quiet; then
            git commit -m "style(ai): apply Ruff formatting to scoped AI merge fixes"
            git push origin HEAD:refs/heads/integration/frontend-acceptance-ai-20261027
          fi
