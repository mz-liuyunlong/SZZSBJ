name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  rule-pack-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check required rule files
        run: |
          bash scripts/check-rule-pack.sh

      - name: Protect old-system from normal PR changes
        if: github.event_name == 'pull_request'
        run: |
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"

          changed="$(git diff --name-only "$base_sha...$head_sha")"
          echo "$changed"

          protected_changed="$(printf '%s\n' "$changed" | awk '/^old-system\// && $0 != "old-system/README.md" { print }')"

          if [ -n "$protected_changed" ]; then
            echo "$protected_changed"
            echo "old-system is read-only. Changes require explicit owner approval and must not be included in normal PRs." >&2
            exit 1
          fi

      - name: Basic secret pattern check
        run: |
          ! grep -RInE 'BEGIN (OPENSSH|RSA|EC) PRIVATE KEY|sk-[A-Za-z0-9_-]{30,}|xox[baprs]-[A-Za-z0-9-]{20,}' . \
            --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=old-system || \
            (echo "Potential secret detected" >&2; exit 1)

  frontend-if-present:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        if: hashFiles('frontend/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend checks
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run lint --if-present
          npm run typecheck --if-present
          npm run test --if-present -- --run
          npm run build --if-present
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['test:e2e'] ? 0 : 1)"; then
            npx playwright install --with-deps
            npm run test:e2e
          else
            echo "No test:e2e script yet; skipping Playwright E2E."
          fi

  backend-if-present:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        if: hashFiles('backend/pyproject.toml') != ''
        uses: astral-sh/setup-uv@v5
      - name: Setup Python
        if: hashFiles('backend/pyproject.toml') != ''
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Backend checks
        if: hashFiles('backend/pyproject.toml') != ''
        working-directory: backend
        run: |
          uv sync
          uv run ruff format --check .
          uv run ruff check .
          uv run pytest
          uv run python -c "import app.main"

  wfs-migration-smoke:
    name: WFS PostgreSQL migration smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: szzsbj_ci
          POSTGRES_USER: szzsbj_ci
          POSTGRES_PASSWORD: local_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U szzsbj_ci -d szzsbj_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: dev
      DATABASE_URL: postgresql+psycopg://szzsbj_ci:local_ci_only@127.0.0.1:5432/szzsbj_ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Upgrade isolated PostgreSQL from base to WFS 0036
        working-directory: backend
        run: |
          uv sync
          uv run alembic upgrade head
          uv run python - <<'PY'
          from sqlalchemy import create_engine, text
          from app.core.config import get_database_url

          with create_engine(get_database_url()).connect() as conn:
              head = conn.execute(
                  text("select version_num from alembic_version")
              ).scalar_one()
              assert head == "20261015_0036_formalize_wfs_fee_cases"
              assert conn.execute(
                  text("select to_regclass('public.ops_wfs_fee_anomaly_cases')")
              ).scalar_one() is not None
              assert conn.execute(
                  text(
                      "select to_regclass("
                      "'public.ops_wfs_fee_anomaly_cases_legacy_shape_backup')"
                  )
              ).scalar_one() is not None
          PY
