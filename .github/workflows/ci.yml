      TEST_DATABASE_URL: postgresql+psycopg://domestic_chain_ci:local_ci_only@127.0.0.1:5432/domestic_chain_ci
      DOMESTIC_CHAIN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Verify historical 0054 and current packing draft migrations
        working-directory: backend
        run: |
          uv sync --frozen
          uv run pytest -q -s tests/db/test_domestic_chain_postgresql.py tests/db/test_packing_pending_edit_postgresql.py tests/db/test_packing_passcode_redis.py tests/db/test_domestic_database_safety.py tests/modules/pmc_domestic/test_domestic_ods_adopt.py tests/db/test_alembic_scaffold.py --junitxml=domestic-chain-results.xml
          uv run python -c "import xml.etree.ElementTree as E; r=E.parse('domestic-chain-results.xml'); assert r.findall('.//testcase') and not r.findall('.//skipped'), 'Domestic PostgreSQL acceptance must execute without skipped cases'"

  walmart-order-identity-postgresql:
    name: Walmart order identity PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: walmart_order_identity_test
          POSTGRES_USER: walmart_order_identity_test
          POSTGRES_PASSWORD: local_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U walmart_order_identity_test -d walmart_order_identity_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+psycopg://walmart_order_identity_test:local_ci_only@127.0.0.1:5432/walmart_order_identity_test
      WALMART_ORDER_IDENTITY_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Migrate isolated database and verify order identity convergence
        working-directory: backend
        run: |
          uv sync --frozen
          uv run alembic upgrade 20261019_0046_operation_logs
          uv run alembic upgrade 20261020_0047_walmart_order_identity_guard
          uv run pytest -q -s \
            tests/modules/integration_sync/test_walmart_order_identity_postgresql.py
          uv run pytest -q -s \
            tests/modules/integration_sync/test_sem_attribution_postgresql.py
          uv run pytest -q -s \
            tests/modules/integration_sync/test_walmart_order_identity_downgrade_postgresql.py
          uv run alembic downgrade 20261019_0046_operation_logs
          uv run python - <<'PY'
          from sqlalchemy import create_engine, inspect, text
          from app.core.config import Settings, get_test_database_url

          engine = create_engine(get_test_database_url(Settings()))
          with engine.connect() as connection:
              assert connection.scalar(text("select version_num from alembic_version")) == "20261019_0046_operation_logs"
              assert connection.scalar(text("select to_regclass('audit_walmart_order_item_conflicts')")) is None
          columns = {column["name"] for column in inspect(engine).get_columns("fact_walmart_order_items")}
          assert "canonical_identity_hash" not in columns
          assert "is_identity_current" not in columns
          assert "provider_item_id" not in columns
          assert "item_id_resolution_source" not in columns
          engine.dispose()
          PY

