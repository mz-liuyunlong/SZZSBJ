name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  rule-pack-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check required rule files
        run: |
          bash scripts/check-rule-pack.sh

      - name: Protect old-system from normal PR changes
        if: github.event_name == 'pull_request'
        run: |
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"

          changed="$(git diff --name-only "$base_sha...$head_sha")"
          echo "$changed"

          protected_changed="$(printf '%s\n' "$changed" | awk '/^old-system\// && $0 != "old-system/README.md" { print }')"

          if [ -n "$protected_changed" ]; then
            echo "$protected_changed"
            echo "old-system is read-only. Changes require explicit owner approval and must not be included in normal PRs." >&2
            exit 1
          fi

      - name: Basic secret pattern check
        run: |
          ! grep -RInE 'BEGIN (OPENSSH|RSA|EC) PRIVATE KEY|sk-[A-Za-z0-9_-]{30,}|xox[baprs]-[A-Za-z0-9-]{20,}' . \
            --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=old-system || \
            (echo "Potential secret detected" >&2; exit 1)

  frontend-if-present:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        if: hashFiles('frontend/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend checks
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run lint --if-present
          npm run typecheck --if-present
          npm run test --if-present -- --run
          npm run build --if-present
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['test:e2e'] ? 0 : 1)"; then
            npx playwright install --with-deps
            npm run test:e2e
          else
            echo "No test:e2e script yet; skipping Playwright E2E."
          fi

  backend-if-present:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        if: hashFiles('backend/pyproject.toml') != ''
        uses: astral-sh/setup-uv@v5
      - name: Setup Python
        if: hashFiles('backend/pyproject.toml') != ''
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Backend checks
        if: hashFiles('backend/pyproject.toml') != ''
        working-directory: backend
        run: |
          uv sync
          uv run ruff format --check .
          uv run ruff check .
          uv run pytest
          uv run python -c "import app.main"

  iam-auth-postgresql:
    name: IAM auth PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: iam_auth_test
          POSTGRES_USER: iam_auth_test
          POSTGRES_PASSWORD: local_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iam_auth_test -d iam_auth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+psycopg://iam_auth_test:local_ci_only@127.0.0.1:5432/iam_auth_test
      IAM_AUTH_PERFORMANCE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Migrate isolated database and verify IAM auth semantics
        working-directory: backend
        run: |
          uv sync --frozen
          uv run alembic upgrade head
          uv run pytest -q -s \
            tests/modules/iam/test_auth_query_performance.py \
            tests/modules/iam/test_auth_postgresql_integration.py

  pmc-0043-postgresql-14:
    name: PMC 0043 PostgreSQL 14 compatibility
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: pmc_0043_test
          POSTGRES_USER: pmc_0043_test
          POSTGRES_PASSWORD: local_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pmc_0043_test -d pmc_0043_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+psycopg://pmc_0043_test:local_ci_only@127.0.0.1:5432/pmc_0043_test
      PMC_0043_POSTGRESQL_TESTS: "1"
      PMC_0043_EXPECTED_POSTGRES_MAJOR: "14"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Verify 0042 to 0043 compatibility on PostgreSQL 14
        working-directory: backend
        run: |
          uv sync --frozen
          uv run alembic upgrade 20261017_0042_rbac_backfill
          uv run pytest -q -s tests/modules/pmc_purchase/test_0043_postgresql_integration.py

  wfs-migration-smoke:
    name: WFS PostgreSQL migration smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wfs_ci
          POSTGRES_USER: wfs_ci
          POSTGRES_PASSWORD: local_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wfs_ci -d wfs_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: dev
      DATABASE_URL: postgresql+psycopg://wfs_ci:local_ci_only@127.0.0.1:5432/wfs_ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Upgrade isolated PostgreSQL from base to WFS 0036
        working-directory: backend
        run: |
          uv sync
          # Synthetic pre-0036 schema only: earlier migrations are out of scope
          # and some have revisions longer than Alembic's default varchar(32).
          uv run python - <<'PY'
          from sqlalchemy import create_engine, text
          from app.core.config import get_database_url

          engine = create_engine(get_database_url())
          with engine.begin() as conn:
              statements = [
                  "create table alembic_version (version_num varchar(32) primary key)",
                  "insert into alembic_version (version_num) values "
                  "('20261014_0035_add_auth_rbac')",
                  "create table app_roles (id uuid primary key, "
                  "role_key varchar(64) not null unique)",
                  "create table app_permissions (permission_key varchar(128) primary key, "
                  "name varchar(64) not null, group_key varchar(64) not null, "
                  "description varchar(255))",
                  "create table app_role_permissions (role_id uuid not null "
                  "references app_roles(id), permission_key varchar(128) not null "
                  "references app_permissions(permission_key), "
                  "created_at timestamptz not null, "
                  "primary key (role_id, permission_key))",
                  "insert into app_roles (id, role_key) values "
                  "('11111111-1111-4111-8111-111111111111', 'admin'), "
                  "('22222222-2222-4222-8222-222222222222', 'operations'), "
                  "('44444444-4444-4444-8444-444444444444', 'warehouse')",
                  "create table ops_wfs_fee_anomaly_cases (id uuid primary key)",
              ]
              for statement in statements:
                  conn.execute(text(statement))
          PY
          uv run alembic upgrade 20261015_0036_wfs_cases
          uv run python - <<'PY'
          from sqlalchemy import create_engine, text
          from app.core.config import get_database_url

          with create_engine(get_database_url()).connect() as conn:
              head = conn.execute(
                  text("select version_num from alembic_version")
              ).scalar_one()
              assert head == "20261015_0036_wfs_cases"
              assert conn.execute(
                  text("select to_regclass('public.ops_wfs_fee_anomaly_cases')")
              ).scalar_one() is not None
              assert conn.execute(
                  text(
                      "select to_regclass("
                      "'public.ops_wfs_fee_anomaly_cases_legacy_shape_backup')"
                  )
              ).scalar_one() is not None
          PY
          PYTHONPATH=. uv run python scripts/ci_wfs_case_smoke.py
          # Follow-up migration stays independently verifiable in the same isolated DB.
          uv run alembic upgrade 20261016_0037_approval_workbench
          uv run python - <<'PY'
          from sqlalchemy import create_engine, text
          from app.core.config import get_database_url
          with create_engine(get_database_url()).connect() as conn:
              assert conn.scalar(text("select version_num from alembic_version")) == "20261016_0037_approval_workbench"
              for table in ("app_approval_requests", "app_approval_events"):
                  assert conn.scalar(text("select to_regclass(:name)"), {"name": table}) is not None
          PY
  approval-migration-smoke:
    name: Approval 0044-0045 PostgreSQL migration smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: approval_ci
          POSTGRES_USER: approval_ci
          POSTGRES_PASSWORD: local_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U approval_ci -d approval_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: dev
      DATABASE_URL: postgresql+psycopg://approval_ci:local_ci_only@127.0.0.1:5432/approval_ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Validate approval 0044 and 0045 on isolated PostgreSQL
        working-directory: backend
        run: |
          uv sync
          PYTHONPATH=. uv run python scripts/ci_approval_migration_smoke.py bootstrap
          uv run alembic upgrade 20261019_0045_approval_scope
          PYTHONPATH=. uv run python scripts/ci_approval_migration_smoke.py verify
  operation-logs-migration-smoke:
    name: Operation logs 0046 PostgreSQL migration smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: opslog_ci
          POSTGRES_USER: opslog_ci
          POSTGRES_PASSWORD: local_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opslog_ci -d opslog_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: dev
      DATABASE_URL: postgresql+psycopg://opslog_ci:local_ci_only@127.0.0.1:5432/opslog_ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Migrate isolated PostgreSQL through operation-logs revision 0046
        working-directory: backend
        run: |
          uv sync --frozen
          # Verify this feature at its own revision; IAM separately tests head.
          uv run alembic upgrade 20261019_0046_operation_logs
          uv run python - <<'PY'
          from sqlalchemy import create_engine, text
          from app.core.config import get_database_url

          with create_engine(get_database_url()).connect() as conn:
              assert conn.scalar(text("select version_num from alembic_version")) == "20261019_0046_operation_logs"
              for name in (
                  "ops_system_operation_events",
                  "ops_manual_operation_logs",
                  "ops_operation_log_links",
                  "ops_lingxing_owner_user_mappings",
                  "ops_lingxing_owner_mapping_audit",
              ):
                  assert conn.scalar(text("select to_regclass(:name)"), {"name": name}) is not None
              assert conn.scalar(text("select count(*) from app_permissions where permission_key = 'action:operations:log:edit'")) == 1
          PY
      - name: Test real PostgreSQL operation-log owner isolation and event reconciliation
        working-directory: backend
        env:
          CI: "true"
          OPERATION_LOG_POSTGRES_TESTS: "1"
        run: |
          uv run pytest -q tests/modules/operation_logs/test_postgresql_integration.py
