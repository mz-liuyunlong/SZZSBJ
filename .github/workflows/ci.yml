name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  rule-pack-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check required rule files
        run: |
          bash scripts/check-rule-pack.sh

      - name: Protect old-system from normal PR changes
        if: github.event_name == 'pull_request' && github.head_ref != 'chore/import-old-system-reference'
        run: |
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"

          changed="$(git diff --name-only "$base_sha...$head_sha")"
          echo "$changed"

          protected_changed="$(printf '%s\n' "$changed" | awk '/^old-system\// && $0 != "old-system/README.md" { print }')"

          if [ -n "$protected_changed" ]; then
            echo "$protected_changed"
            echo "old-system is read-only. Changes require explicit owner approval and must not be included in normal PRs." >&2
            exit 1
          fi

      - name: Basic secret pattern check
        run: |
          ! grep -RInE 'BEGIN (OPENSSH|RSA|EC) PRIVATE KEY|sk-[A-Za-z0-9_-]{30,}|xox[baprs]-[A-Za-z0-9-]{20,}' . \
            --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=old-system || \
            (echo "Potential secret detected" >&2; exit 1)

  frontend-if-present:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        if: hashFiles('frontend/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend checks
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run lint --if-present
          npm run typecheck --if-present
          npm run test --if-present -- --run
          npm run build --if-present
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['test:e2e'] ? 0 : 1)"; then
            npx playwright install --with-deps
            npm run test:e2e
          else
            echo "No test:e2e script yet; skipping Playwright E2E."
          fi

  backend-if-present:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        if: hashFiles('backend/pyproject.toml') != ''
        uses: astral-sh/setup-uv@v5
      - name: Setup Python
        if: hashFiles('backend/pyproject.toml') != ''
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Backend checks
        if: hashFiles('backend/pyproject.toml') != ''
        working-directory: backend
        run: |
          uv sync
          uv run ruff format --check .
          uv run ruff check .
          uv run pytest
          uv run python -c "import app.main"
