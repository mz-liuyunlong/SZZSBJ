name: RBAC v2 one-time autofix

on:
  push:
    branches:
      - feat/iam-rbac-v2-complete

permissions:
  contents: write

jobs:
  autofix:
    if: ${{ !contains(github.event.head_commit.message, '[rbac-autofix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/iam-rbac-v2-complete
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Patch permission-aware frontend tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          routes = Path("frontend/src/router/routes.test.tsx")
          text = routes.read_text()

          import_line = 'import { DEFAULT_AUTH_USER, type AuthUser } from "@/pages/auth/authTypes";\n'
          if import_line not in text:
              marker = 'import { DEFAULT_BUSINESS_PATH, resolveRoute } from "@/router/routeResolver";\n'
              if marker not in text:
                  raise SystemExit("routeResolver import marker not found")
              text = text.replace(marker, marker + import_line, 1)

          text, count = re.subn(
              r'''vi\.mock\("@/pages/auth/LoginPage", \(\) => \(\{.*?\n\}\)\);''',
              '''vi.mock("@/pages/auth/LoginPage", () => ({
            default: ({ onLogin }: { onLogin: (user: AuthUser) => void }) => (
              <button type="button" onClick={() => onLogin(DEFAULT_AUTH_USER)}>
                模拟登录
              </button>
            ),
          }));''',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("LoginPage mock block not found")

          text, count = re.subn(
              r'''function RoutesHarness\(\{ initialLoggedIn \}: \{ initialLoggedIn: boolean \}\) \{.*?\n\}\n\nconst renderRoutes''',
              '''function RoutesHarness({ initialLoggedIn }: { initialLoggedIn: boolean }) {
            const [mockLoggedIn, setMockLoggedIn] = useState(initialLoggedIn);
            const [currentUser, setCurrentUser] = useState<AuthUser | undefined>(
              initialLoggedIn ? DEFAULT_AUTH_USER : undefined,
            );
            return (
              <AppRoutes
                mockLoggedIn={mockLoggedIn}
                currentUser={currentUser}
                onLogin={(user) => {
                  setCurrentUser(user);
                  setMockLoggedIn(true);
                }}
                onLogout={() => {
                  setCurrentUser(undefined);
                  setMockLoggedIn(false);
                }}
              />
            );
          }

          const renderRoutes''',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("RoutesHarness block not found")

          restore_test = '''  it("keeps mock auth in memory while restoring the path-only workspace after login", async () => {
            const restoredPath = "/sales/daily-sales";
            sessionStorage.setItem(
              TAB_WORKSPACE_STORAGE_KEY,
              JSON.stringify({
                version: TAB_WORKSPACE_VERSION,
                openPaths: [DEFAULT_BUSINESS_PATH, restoredPath],
                activePath: restoredPath,
              }),
            );
            renderRoutes(restoredPath);

            expect(await screen.findByRole("button", { name: "模拟登录" })).toBeVisible();
            expect(screen.getByLabelText("当前路径")).toHaveTextContent("/login");

            fireEvent.click(screen.getByRole("button", { name: "模拟登录" }));
            await waitFor(() => {
              expect(screen.getByLabelText("当前路径")).toHaveTextContent(restoredPath);
            });
            expect(screen.getByRole("heading", { name: "当前页面" })).toHaveTextContent(
              "每日销售",
            );
          });

          it("redirects unauthenticated business visits to login"'''
          text, count = re.subn(
              r'''  it\("keeps mock auth in memory while restoring the path-only workspace after login".*?\n  it\("redirects unauthenticated business visits to login"''',
              restore_test,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("workspace restore test block not found")

          hidden_test = '''  it("renders the default route and rejects hidden business routes", async () => {
            const { unmount } = renderRoutes(DEFAULT_BUSINESS_PATH, true);
            expect(screen.getByRole("main", { name: "业务布局" })).toBeVisible();
            expect(screen.getByRole("heading", { name: "当前页面" })).toHaveTextContent(
              "Listing管理",
            );
            expect(screen.getByText("products_listing_management")).toBeVisible();

            unmount();
            renderRoutes("/data-center/documentation", true);
            await waitFor(() => {
              expect(screen.getByLabelText("当前路径")).toHaveTextContent(
                "/dashboard/today-sales",
              );
            });
            expect(screen.getByRole("main", { name: "业务布局" })).toBeVisible();
            expect(screen.getByRole("heading", { name: "当前页面" })).toHaveTextContent(
              "今日销售",
            );
            expect(screen.queryByLabelText("页面状态：hidden")).not.toBeInTheDocument();
          });

          it("uses the approved product page shells'''
          text, count = re.subn(
              r'''  it\("renders the default and hidden business routes when mock logged in".*?\n  it\("uses the approved product page shells''',
              hidden_test,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("hidden route test block not found")
          routes.write_text(text)

          layout = Path("frontend/src/layouts/MainLayout.test.tsx")
          text = layout.read_text()
          replacement = '''    fireEvent.mouseEnter(screen.getByRole("button", { name: "用户菜单" }));
            expect(await screen.findByRole("menuitem", { name: "退出" })).toBeVisible();
            expect(
              screen.queryByRole("menuitem", { name: personalCenter.title }),
            ).not.toBeInTheDocument();
            expect(
              screen.queryByRole("menuitem", { name: documentation.title }),
            ).not.toBeInTheDocument();
            expect(window.location.hash).toBe(`#${aiAssistant.path}`);
          }, 30_000);'''
          text, count = re.subn(
              r'''    fireEvent\.mouseEnter\(screen\.getByRole\("button", \{ name: "用户菜单" \}\)\);\n    fireEvent\.click\(await screen\.findByRole\("menuitem", \{ name: personalCenter\.title \}\)\);.*?    expect\(window\.location\.hash\)\.toBe\(`#\$\{documentation\.path\}`\);\n  \}, 30_000\);''',
              replacement,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("MainLayout hidden topbar test block not found")
          layout.write_text(text)
          PY

      - name: Format backend RBAC files
        working-directory: backend
        run: |
          uv sync
          uv run ruff format \
            app/core/permission_policy_v2.py \
            app/modules/iam/permission_catalog_v2.py \
            app/modules/iam/rbac_router.py \
            app/modules/iam/rbac_service.py \
            tests/core/test_permission_policy_v2.py

      - name: Commit autofix and remove one-time workflow
        run: |
          git rm .github/workflows/rbac-v2-autofix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend frontend
          git commit -m "fix(ci): format RBAC and align permission-aware tests [rbac-autofix]"
          git push origin HEAD:feat/iam-rbac-v2-complete

      - name: Verify backend
        working-directory: backend
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run pytest
          uv run python -c "import app.main"

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint --if-present
          npm run test --if-present -- --run
          npm run build --if-present
