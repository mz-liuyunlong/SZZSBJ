name: PR324 one-time source format
on:
  push:
    branches: [ci/clearance-v57-20261108]
permissions:
  contents: write
jobs:
  format-pr324-once:
    if: github.repository == 'mz-liuyunlong/SZZSBJ' && github.ref == 'refs/heads/ci/clearance-v57-20261108'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply Ruff safe fixes and format only clearance PR files
        shell: bash
        run: |
          set -euo pipefail
          BASE=7043a2bb3ae4d9bb96810b611343a85d775e04ee
          mapfile -t PYFILES < <(git diff --name-only "$BASE" HEAD -- backend | grep -E '^backend/.*\.py$' | sed 's#^backend/##')
          test "${#PYFILES[@]}" -gt 20
          cd backend
          pip install ruff==0.16.5
          ruff check --fix "${PYFILES[@]}" || true
          ruff format "${PYFILES[@]}"
          ruff check .
          ruff format --check .
          cd ..
          git diff --check
      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/ci/clearance-v57-20261108"
          git rm -- .github/workflows/pr324_autofix_once.yml
          git add -- backend
          git diff --cached --check
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "style(clearance): apply Ruff safe fixes and format PR Python"
          git push origin HEAD:ci/clearance-v57-20261108
