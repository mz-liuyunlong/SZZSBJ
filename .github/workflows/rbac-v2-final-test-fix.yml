name: RBAC v2 final frontend assertion fix

on:
  push:
    branches:
      - feat/iam-rbac-v2-complete

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/iam-rbac-v2-complete
          fetch-depth: 0

      - name: Patch assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("frontend/src/layouts/MainLayout.test.tsx")
          text = path.read_text()
          old = 'expect(await screen.findByRole("menuitem", { name: "退出" })).toBeVisible();'
          new = 'expect(await screen.findByRole("menuitem", { name: "退出" })).toBeInTheDocument();'
          if old not in text:
              raise SystemExit("target assertion not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit fix and remove workflow
        run: |
          git rm .github/workflows/rbac-v2-final-test-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/layouts/MainLayout.test.tsx
          git commit -m "fix(test): align user-menu assertion with portal behavior [rbac-final-test-fix]"
          git push origin HEAD:feat/iam-rbac-v2-complete
