function pill(label,color='gray'){return `<span class="pill ${color}">${esc(label)}</span>`}
function person(name){return `<span class="person"><span class="person-avatar">${esc(initials(name))}</span><span class="person-name">${esc(name)}</span></span>`}
function gradePill(g){return g?pill(`${g} 级`,gradeColor(g)):pill('未评级','gray')}
function renderFilters(){const cats=['all',...new Set([...products.map(p=>p.category)])];const devs=['all',...new Set(products.map(p=>p.developer))];const ops=['all',...new Set(products.map(p=>p.operator))];return `<div class="filters-card"><select class="field-select" data-filter="period" aria-label="统计周期"><option value="30" ${state.period==='30'?'selected':''}>近30天</option><option value="60" ${state.period==='60'?'selected':''}>近60天</option><option value="90" ${state.period==='90'?'selected':''}>近90天</option><option value="all" ${state.period==='all'?'selected':''}>全部周期</option></select><select class="field-select" data-filter="category" aria-label="类目"><option value="all">全部类目</option>${cats.slice(1).map(x=>`<option value="${esc(x)}" ${state.category===x?'selected':''}>${esc(x)}</option>`).join('')}</select><select class="field-select" data-filter="developer" aria-label="新品开发人员"><option value="all">全部开发人员</option>${devs.slice(1).map(x=>`<option value="${esc(x)}" ${state.developer===x?'selected':''}>${esc(x)}</option>`).join('')}</select><select class="field-select" data-filter="operator" aria-label="运营人员"><option value="all">全部运营人员</option>${ops.slice(1).map(x=>`<option value="${esc(x)}" ${state.operator===x?'selected':''}>${esc(x)}</option>`).join('')}</select><div class="search-connected"><select id="searchType" aria-label="搜索类型"><option>SKU</option><option>品名</option><option>Item ID</option></select><input id="searchInput" value="${esc(state.search)}" placeholder="搜索 SKU / 品名 / Item ID"/><button id="applySearch" title="搜索">⌕</button></div><button class="btn" id="resetFilters">重置</button><span class="filters-divider"></span><span class="hint">统计口径：${state.period==='all'?'全部周期':`近${state.period}天`} · 示例数据</span><span class="filter-spacer"></span><button class="btn small" id="toggleStat">隐藏统计</button></div>`}

function lineChart(id,values,labels,color='#1677ff'){const w=620,h=180,l=36,r=12,t=14,b=26,pw=w-l-r,ph=h-t-b;const max=Math.max(...values)*1.18||1;const pts=values.map((v,i)=>`${l+i*(pw/(values.length-1))},${t+ph-(v/max)*ph}`).join(' ');const area=`${l},${t+ph} ${pts} ${l+pw},${t+ph}`;return `<div class="chart-wrap"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="lineFill" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity=".20"/><stop offset="100%" stop-color="${color}" stop-opacity=".01"/></linearGradient></defs>${[0,1,2,3].map(i=>{const y=t+i*(ph/3);return `<line class="chart-grid" x1="${l}" y1="${y}" x2="${l+pw}" y2="${y}"/><text class="chart-label" x="2" y="${y+3}">${Math.round(max*(1-i/3))}%</text>`}).join('')}<polygon class="chart-area" points="${area}"/><polyline class="chart-line" style="stroke:${color}" points="${pts}"/>${values.map((v,i)=>{const x=l+i*(pw/(values.length-1)),y=t+ph-(v/max)*ph;return `<circle class="chart-dot" cx="${x}" cy="${y}" r="3" style="stroke:${color}"/>`}).join('')}${labels.map((x,i)=>`<text class="chart-label" x="${l+i*(pw/(labels.length-1))}" y="${h-6}" text-anchor="middle">${x}</text>`).join('')}</svg></div>`}
function gradeDistribution(data){const colors={S:'#722ed1',A:'#1677ff',B:'#389e0d',C:'#d97706',D:'#cf1322',Pass:'#98a2b3'};return `<div class="grade-bars">${data.map(x=>`<div class="grade-row"><span class="grade-label">${x.g}</span><div class="bar-track"><div class="bar-fill" style="width:${x.v}%;background:${colors[x.g]}"></div></div><span class="grade-value">${x.count}</span></div>`).join('')}</div><div class="grade-legend">${data.map(x=>`<span class="hint">${x.g} ${x.v}%</span>`).join('')}</div>`}
function tablePanel(title,subtitle,headers,rows,opts={}){return `<section class="panel table-panel"><div class="table-toolbar"><div class="table-toolbar-left"><span class="table-toolbar-title">${title}</span>${subtitle?`<span class="table-toolbar-count">${subtitle}</span>`:''}</div>${opts.action||''}</div><div class="table-scroll"><table class="data-table" style="min-width:${opts.minWidth||760}px"><thead><tr>${headers.map(h=>`<th class="${h.align==='right'?'align-right':''}" style="${h.width?`width:${h.width}`:''}">${h.label}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty-state">暂无数据</td></tr>`}</tbody></table></div>${opts.footer||''}</section>`}
function getFilteredProducts(){return products.filter(p=>(state.category==='all'||p.category===state.category)&&(state.developer==='all'||p.developer===state.developer)&&(state.operator==='all'||p.operator===state.operator)&&(!state.search||`${p.id} ${p.name}`.toLowerCase().includes(state.search.toLowerCase()))).filter(p=>{if(state.activeMetric==='pending')return p.listedDays>=state.config.remindDays&&p.marketScore===null;if(state.activeMetric==='passed')return p.marketScore!==null&&p.grade&&!['D','Pass'].includes(p.grade);if(state.activeMetric==='success')return p.trackingStatus==='打品成功';if(state.activeMetric==='purchase')return ['待运营确认','待领导审核','已批准'].includes(p.purchaseStatus);return true})}

function renderScoredRows(){return getFilteredProducts().filter(p=>p.marketScore!==null).map(p=>`<tr><td><div class="primary-cell">${esc(p.id)}</div><div class="secondary-cell">${esc(p.name)}</div></td><td>${esc(p.category)}</td><td>${person(p.developer)}</td><td class="num">${p.score?.toFixed(2)??'—'}</td><td>${gradePill(p.grade)}</td><td class="num">${p.suggestedQty?fmt(p.suggestedQty)+' 件':'—'}</td><td>${pill(p.purchaseStatus!=='未生成'?p.purchaseStatus:p.scoreStatus,statusColor(p.purchaseStatus!=='未生成'?p.purchaseStatus:p.scoreStatus))}</td><td class="action-cell"><button class="btn small" data-detail="${p.id}">评分明细</button>${p.suggestedQty&&['未生成','待运营确认','审核驳回'].includes(p.purchaseStatus)?` <button class="btn primary small" data-purchase="${p.id}">采购确认</button>`:''}</td></tr>`).join('')}
function renderNewDashboard(){const pending=getFilteredProducts().filter(p=>p.listedDays>=state.config.remindDays&&p.marketScore===null);const scored=getFilteredProducts().filter(p=>p.marketScore!==null);return `${renderFilters()}<div class="section-note"><span style="color:#1677ff">ⓘ</span><div><strong>评分触发规则：</strong>Listing 上架满 ${state.config.remindDays} 天后提醒运营填写市场竞争评分；只有运营提交市场评分后，系统才正式计算总分、评级和建议采购量。</div></div><div class="stat-grid">${statCard('本期测品数量','128','较上期 +18','▤','all')}${statCard('测评通过率','42.2%','通过 54 / 已完成 128','↗','passed')}${statCard('测评通过类目','18','有通过产品的类目','▦','category')}${statCard('待评分提醒',pending.length,`上架满 ${state.config.remindDays} 天`,`◷`,'pending')}</div><div class="panel-grid"><section class="panel"><div class="panel-head"><div><span class="panel-title">测评通过率趋势</span><span class="panel-subtitle">按测评完成时间</span></div><div class="panel-head-actions"><span class="hint">${state.period==='all'?'全部周期':`近${state.period}天`}</span></div></div><div class="panel-body">${lineChart('passTrend',[31,35,34,38,40,42.2],['第1周','第2周','第3周','第4周','第5周','本周'])}<div class="legend"><span><i class="legend-dot" style="background:#1677ff"></i>测评通过率</span><span class="hint">通过率按已完成且有效测评计算</span></div></div></section><section class="panel"><div class="panel-head"><div><span class="panel-title">测评等级分布</span><span class="panel-subtitle">已完成测评</span></div><button class="text-link" data-view="grades">查看等级明细 →</button></div><div class="panel-body">${gradeDistribution([{g:'S级',v:8,count:8},{g:'A级',v:24,count:24},{g:'B级',v:38,count:38},{g:'C级',v:26,count:26},{g:'D级',v:18,count:18},{g:'Pass',v:14,count:14}])}</div></section></div><div class="panel-grid equal">${tablePanel('类目测评表现','通过率与平均得分',[{label:'产品类目'},{label:'测评数',align:'right'},{label:'通过数',align:'right'},{label:'通过率'},{label:'平均得分',align:'right'},{label:'分析建议'}],renderCategoryRows(),{minWidth:620,action:'<button class="text-link" data-view="categories">全部类目 →</button>'})}${tablePanel('新品开发人员表现','按已完成测评统计',[{label:'开发人员'},{label:'测评数',align:'right'},{label:'通过数',align:'right'},{label:'通过率'},{label:'平均得分',align:'right'},{label:'操作',align:'right'}],renderDeveloperRows(),{minWidth:620})}</div>${tablePanel('待市场评分新品',`${pending.length} 个需要运营处理`,[{label:'商品'},{label:'类目'},{label:'开发人员'},{label:'上架天数',align:'right'},{label:'评分状态'},{label:'提醒规则'},{label:'操作',align:'right'}],renderPendingRows(),{minWidth:900,action:'<span class="hint">仅提醒，不自动评分</span>'})}${tablePanel('已完成测评',`${scored.length} 个已生成评分`,[{label:'商品'},{label:'类目'},{label:'开发人员'},{label:'总分',align:'right'},{label:'评级'},{label:'建议采购量',align:'right'},{label:'状态'},{label:'操作',align:'right'}],renderScoredRows(),{minWidth:1050,footer:'<div class="table-footer"><span>显示当前筛选结果 · 示例数据</span><div class="pager"><button>‹</button><button class="active">1</button><button>2</button><button>3</button><button>›</button></div></div>'})}`}

function renderLaunchDashboard(){const pending=products.filter(p=>p.purchaseStatus==='待运营确认'||p.purchaseStatus==='待领导审核');return `${renderFilters()}<div class="section-note"><span style="color:#1677ff">ⓘ</span><div><strong>打品统计口径：</strong>只统计已进入有效打品追踪的产品；尚未达到评估周期的新品计入观察中，不直接判定失败。采购金额和资金风险仅在领导视角显示。</div></div><div class="stat-grid">${statCard('进入打品池','46','采购批准后进入追踪','▣','all')}${statCard('打品成功率','32.6%','成功 15 / 已完成评估 46','↗','success')}${statCard('打品成功类目','7','至少有 1 个成功产品','▦','category')}${statCard('采购待处理',pending.length+6,'待运营确认 / 待领导审核','◷','purchase')}</div><div class="panel-grid"><section class="panel"><div class="panel-head"><div><span class="panel-title">打品成功率趋势</span><span class="panel-subtitle">按完成评估的产品统计</span></div><span class="hint">近 6 个周期</span></div><div class="panel-body">${lineChart('launchTrend',[21,24,28,27,30,32.6],['周期1','周期2','周期3','周期4','周期5','本期'],'#0d9488')}<div class="legend"><span><i class="legend-dot" style="background:#0d9488"></i>打品成功率</span><span class="hint">观察中产品不计入失败</span></div></div></section><section class="panel"><div class="panel-head"><div><span class="panel-title">测评等级与打品结果</span><span class="panel-subtitle">验证评分预测能力</span></div></div><div class="panel-body">${gradeDistribution([{g:'S级',v:62.5,count:'62.5%'},{g:'A级',v:48.3,count:'48.3%'},{g:'B级',v:30.2,count:'30.2%'},{g:'C级',v:18.4,count:'18.4%'},{g:'D级',v:8,count:'8.0%'},{g:'Pass',v:0,count:'—'}])}</div></section></div><div class="panel-grid equal">${tablePanel('类目打品表现与深挖建议','结合成功率与样本量',[{label:'产品类目'},{label:'进入打品池',align:'right'},{label:'成功数',align:'right'},{label:'成功率'},{label:'当前判断'},{label:'操作',align:'right'}],renderCategoryLaunchRows(),{minWidth:700})}${tablePanel('运营人员打品表现','按已完成有效评估统计',[{label:'运营人员'},{label:'追踪数',align:'right'},{label:'成功数',align:'right'},{label:'成功率'},{label:'平均利润',align:'right'},{label:'样本状态'}],renderOperatorRows(),{minWidth:690})}</div><section class="panel table-panel"><div class="panel-head"><span class="panel-title">采购推进进度</span><span class="panel-subtitle">从评分完成到采购到货</span></div><div class="panel-body"><div class="funnel">${[{label:'待运营确认数量',n:12,w:100},{label:'待领导审核',n:8,w:72},{label:'已批准待采购',n:6,w:54},{label:'采购执行中',n:4,w:38},{label:'已到货进入追踪',n:3,w:26}].map((x,i)=>`<div class="funnel-row"><span>${x.label}</span><div class="funnel-track"><div class="funnel-fill" style="width:${x.w}%"></div></div><strong class="align-right">${x.n}</strong></div>`).join('')}</div></div></section>${tablePanel('打品跟踪明细','采购后销售与库存表现',[{label:'商品'},{label:'类目'},{label:'测评等级'},{label:'批准数量',align:'right'},{label:'采购进度',align:'right'},{label:'近30天销量',align:'right'},{label:'近30天利润',align:'right'},{label:'当前库存',align:'right'},{label:'打品状态'},{label:'操作',align:'right'}],renderTrackingRows(),{minWidth:1180,footer:'<div class="table-footer"><span>观察期不足的产品显示继续观察，不计为失败</span><div class="pager"><button>‹</button><button class="active">1</button><button>2</button><button>›</button></div></div>'})}`}
function renderDashboard(){document.querySelectorAll('.dash-tab').forEach(b=>{b.classList.toggle('active',b.dataset.dashboard===state.dashboard);b.setAttribute('aria-selected',b.dataset.dashboard===state.dashboard?'true':'false')});document.getElementById('dashboardContent').innerHTML=state.dashboard==='new'?renderNewDashboard():renderLaunchDashboard();document.querySelectorAll('.stat-grid').forEach(el=>el.style.display=state.statsVisible?'grid':'none');const toggle=document.getElementById('toggleStat');if(toggle)toggle.textContent=state.statsVisible?'隐藏统计':'显示统计';}
function showMask(id){document.getElementById(id).classList.add('open')}function hideMask(id){document.getElementById(id).classList.remove('open')}
let toastTimer;function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2800)}
function computeScore(p,marketScore){const w=state.config.weights;return (marketScore*w.market+p.auto.order*w.order+p.auto.ads*w.ads+p.auto.profit*w.profit+p.auto.trust*w.trust)/100}
function gradeFor(score){if(score>=9)return 'S';if(score>=8)return 'A';if(score>=7)return 'B';if(score>=6)return 'C';return 'D'}
function suggestedFor(grade,demand){const r=state.config.grades.find(x=>x.grade===grade);if(!r||!r.qtyMax)return 0;return Math.max(r.qtyMin,Math.min(r.qtyMax,Math.round(demand)))}
function openMarket(id){const p=products.find(x=>x.id===id);if(!p)return;state.marketId=id;document.getElementById('marketProductLabel').textContent=`${p.id} · ${p.name} · 上架 ${p.listedDays} 天`;document.getElementById('marketBody').innerHTML=`<div class="alert">市场竞争是唯一人工评分项。提交后，系统才正式计算总分、评级和建议采购量。</div><div class="form-row"><div class="form-item"><label>市场竞争评分 <span class="required">*</span></label><div class="score-input"><input class="text-input" id="marketScoreInput" type="number" min="0" max="10" step="1" value="${p.marketScore??8}"/><span class="hint">0–10 分</span></div></div><div class="form-item"><label>评分标准参考</label><select class="field-select" style="width:100%;max-width:none" id="marketBand"><option value="9">9–10 分 · 竞争适中且差异化明显</option><option value="7" selected>7–8 分 · 有竞争但仍有切入机会</option><option value="5">5–6 分 · 竞争较强</option><option value="3">3–4 分 · 同质化严重</option><option value="1">0–2 分 · 品牌垄断 / 低价竞争</option></select></div></div><div class="form-item"><label>市场判断依据 <span class="required">*</span></label><textarea class="text-area" id="marketReasonInput" placeholder="填写竞品数量、核心竞品售价、Review情况、差异化机会等">${esc(p.marketReason)}</textarea></div><div class="panel" style="margin-top:10px"><div class="panel-head"><span class="panel-title">系统自动评分（只读）</span><span class="hint">提交市场分后计算总分</span></div><div class="panel-body"><div class="score-breakdown">${[['出单速度',p.auto.order],['广告有效性',p.auto.ads],['利润空间',p.auto.profit],['测品数据可信度',p.auto.trust]].map(([n,v])=>`<div class="score-breakdown-row"><span>${n}</span><span class="hint">系统根据现有测品数据计算</span><strong class="score-num">${v} / 10</strong><span></span></div>`).join('')}</div></div></div>`;showMask('marketMask')}
function openCorrection(id,dimension){const p=products.find(x=>x.id===id);if(!p)return;state.correction={id,dimension};const names={order:'出单速度',ads:'广告有效性',profit:'利润空间',trust:'测品数据可信度'};const current=p.auto[dimension];document.getElementById('correctionProductLabel').textContent=`${p.id} · ${p.name} · ${names[dimension]}`;document.getElementById('correctionBody').innerHTML=`<div class="alert warning">申请修正不会立即修改正式分数。审核通过后应保留原分、修正分、依据和规则版本，并重新计算总分。</div><div class="form-row"><div class="form-item"><label>当前系统评分</label><input class="text-input" value="${current} 分" disabled/></div><div class="form-item"><label>申请修正为 <span class="required">*</span></label><input class="text-input" id="correctionScoreInput" type="number" min="0" max="10" step="1" value="${Math.min(10,current+1)}"/></div></div><div class="form-item"><label>修正原因 <span class="required">*</span></label><textarea class="text-area" id="correctionReasonInput" placeholder="例如：规则边界配置错误、数据源未完整同步、计算口径不适用，请说明具体依据"></textarea></div><div class="form-item"><label>补充证据（可选）</label><input class="text-input" id="correctionEvidenceInput" placeholder="数据日期、订单范围或其他核对信息"/></div>`;showMask('correctionMask')}
function openDetail(id){const p=products.find(x=>x.id===id);if(!p)return;state.detailId=id;document.getElementById('detailHeading').textContent=`${p.id} · 评分明细`;document.getElementById('detailSub').textContent=`${p.name} · ${p.category} · 开发 ${p.developer}`;const parts=[['market','市场竞争',p.marketScore,15,false],['order','出单速度',p.auto.order,state.config.weights.order,true],['ads','广告有效性',p.auto.ads,state.config.weights.ads,true],['profit','利润空间',p.auto.profit,state.config.weights.profit,true],['trust','测品数据可信度',p.auto.trust,state.config.weights.trust,true]];document.getElementById('detailBody').innerHTML=`<div class="drawer-kpis"><div class="drawer-kpi"><small>最终得分</small><strong>${p.score===null?'待评分':p.score.toFixed(2)}</strong></div><div class="drawer-kpi"><small>最终评级</small><strong>${p.grade||'—'}</strong></div><div class="drawer-kpi"><small>建议采购量</small><strong>${p.suggestedQty?fmt(p.suggestedQty)+' 件':'—'}</strong></div></div><div class="panel" style="margin-bottom:14px"><div class="panel-head"><span class="panel-title">评分依据与权重</span><span class="hint">原始分保留</span></div><div class="score-breakdown"><div class="score-breakdown-row head"><span>评分维度</span><span>计算依据</span><span class="score-num">原始分</span><span>操作</span></div>${parts.map(([key,label,value,weight,fixable])=>`<div class="score-breakdown-row"><span>${label}<div class="secondary-cell">权重 ${weight}%</div></span><span class="hint">${key==='market'?(p.marketReason||'等待运营填写市场判断'):key==='order'?'首单时间、连续出单、订单量':key==='ads'?'ACOS、CPC、CVR及成交关键词':key==='profit'?'ROI与毛利率':'单件订单占比及成交分散度'}</span><strong class="score-num">${value===null?'—':value+' / 10'}</strong><span class="fix-action">${fixable?`<button class="btn small" data-correct="${p.id}" data-dimension="${key}">申请修正</button>`:'运营填写'}</span></div>`).join('')}</div></div><div class="panel"><div class="panel-head"><span class="panel-title">评分历史与当前状态</span></div><div class="panel-body"><div class="form-row"><div><div class="small-note">评分状态</div><div style="margin-top:5px">${pill(p.scoreStatus,statusColor(p.scoreStatus))}</div></div><div><div class="small-note">修正申请</div><div style="margin-top:5px">${p.correctionStatus?pill(p.correctionStatus,'orange'):'暂无修正申请'}</div></div></div><p class="small-note">系统评分仅在运营提交市场竞争评分后正式计算。修正申请审核前不改变原始得分。</p></div></div>`;showMask('detailMask')}
function openPurchase(id){const p=products.find(x=>x.id===id);if(!p||!p.suggestedQty||['D','Pass'].includes(p.grade)){toast('该产品当前评级不允许生成采购建议');return}state.purchaseId=id;document.getElementById('purchaseProductLabel').textContent=`${p.id} · ${p.name} · ${p.grade} 级`;const r=state.config.grades.find(x=>x.grade===p.grade);document.getElementById('purchaseBody').innerHTML=`<div class="drawer-kpis"><div class="drawer-kpi"><small>最终得分</small><strong>${p.score.toFixed(2)}</strong></div><div class="drawer-kpi"><small>评级</small><strong>${p.grade} 级</strong></div><div class="drawer-kpi"><small>系统建议量</small><strong>${fmt(p.suggestedQty)} 件</strong></div></div><div class="alert">系统建议数量已限制在 ${p.grade} 级采购范围 ${r.qtyMin}–${r.qtyMax} 件。运营可按实际情况修改；修改后必须填写原因。超出范围的申请会在领导审核端标记。</div><div class="form-row"><div class="form-item"><label>系统建议采购量</label><input class="text-input" value="${p.suggestedQty} 件" disabled/></div><div class="form-item"><label>运营申请采购量 <span class="required">*</span></label><input class="text-input" id="purchaseQtyInput" type="number" min="1" step="1" value="${p.suggestedQty}"/></div></div><div id="purchaseQtyWarning"></div><div class="form-item" id="purchaseReasonWrap" style="display:none"><label>数量调整原因 <span class="required">*</span></label><textarea class="text-area" id="purchaseReasonInput" placeholder="请说明修改数量的业务原因，至少5个字符"></textarea></div><div class="small-note">运营视角不展示采购金额和资金风险；领导审核时查看完整财务信息。</div>`;const q=document.getElementById('purchaseQtyInput');q.addEventListener('input',updatePurchaseValidation);updatePurchaseValidation();showMask('purchaseMask')}
function updatePurchaseValidation(){const p=products.find(x=>x.id===state.purchaseId);if(!p)return;const r=state.config.grades.find(x=>x.grade===p.grade);const qty=Number(document.getElementById('purchaseQtyInput')?.value);const changed=qty!==p.suggestedQty;const out=Number.isInteger(qty)&&(qty<r.qtyMin||qty>r.qtyMax);const wrap=document.getElementById('purchaseReasonWrap');if(wrap)wrap.style.display=changed?'block':'none';const warning=document.getElementById('purchaseQtyWarning');if(warning)warning.innerHTML=out?`<div class="alert warning">申请数量 ${qty} 件超出 ${p.grade} 级范围 ${r.qtyMin}–${r.qtyMax} 件。可以提交，但领导审核时会醒目提示。</div>`:'';const reason=document.getElementById('purchaseReasonInput')?.value||'';document.getElementById('submitPurchase').disabled=!(Number.isInteger(qty)&&qty>0&&(!changed||reason.trim().length>=5))}
function openApproval(id){const req=state.purchaseRequests.find(x=>x.id===id);const p=products.find(x=>x.id===req?.productId);if(!req||!p)return;state.approvalId=id;const r=state.config.grades.find(x=>x.grade===p.grade);const out=req.quantity<r.qtyMin||req.quantity>r.qtyMax;document.getElementById('approvalProductLabel').textContent=`${p.id} · ${p.name} · 申请 ${req.quantity} 件`;document.getElementById('approvalBody').innerHTML=`${out?`<div class="alert danger"><strong>超出评级采购范围：</strong>${p.grade} 级允许 ${r.qtyMin}–${r.qtyMax} 件，运营申请 ${req.quantity} 件。请重点审核调整原因。</div>`:''}<div class="drawer-kpis"><div class="drawer-kpi"><small>系统建议数量</small><strong>${p.suggestedQty} 件</strong></div><div class="drawer-kpi"><small>运营申请数量</small><strong>${req.quantity} 件</strong></div><div class="drawer-kpi"><small>调整幅度</small><strong>${req.quantity-p.suggestedQty>0?'+':''}${req.quantity-p.suggestedQty} 件</strong></div></div><div class="form-row"><div class="form-item"><label>最终得分 / 评级</label><input class="text-input" value="${p.score.toFixed(2)} 分 / ${p.grade} 级" disabled/></div><div class="form-item"><label>预计采购金额（领导可见）</label><input class="text-input" value="¥${fmt(req.quantity*p.unitCost)}" disabled/></div></div><div class="form-item"><label>运营调整原因</label><div class="alert ${out?'warning':''}">${esc(req.reason||'按系统建议数量申请，无调整原因')}</div></div><div class="form-row"><div class="form-item"><label>采购资金占用（示例）</label><input class="text-input" value="¥${fmt(req.quantity*p.unitCost)} · 不含头程及其他费用" disabled/></div><div class="form-item"><label>采购交期</label><input class="text-input" value="待供应链数据接入" disabled/></div></div><div class="form-item"><label>审核意见（驳回时必填）</label><textarea class="text-area" id="approvalNote" placeholder="审核意见或驳回原因"></textarea></div>`;showMask('approvalMask')}
function openConfig(){state.configTab='weights';renderConfig();showMask('configMask')}
function renderConfig(){const body=document.getElementById('configBody');let tabs=`<div class="config-tabs">${[['weights','评分权重'],['grades','评级与采购量'],['launch','打品成功标准'],['history','版本历史']].map(([k,n])=>`<button class="config-tab ${state.configTab===k?'active':''}" data-config-tab="${k}">${n}</button>`).join('')}</div>`;let content='';if(state.configTab==='weights'){const labels={market:'市场竞争（运营评分）',order:'出单速度',ads:'广告有效性',profit:'利润空间',trust:'测品数据可信度'};content=`<div class="alert warning">当前按评分表实际评分行采用 15% / 30% / 20% / 25% / 10%。原表顶部说明存在另一套权重，正式上线前需确认规则版本。</div><div class="config-grid">${Object.entries(state.config.weights).map(([k,v])=>`<div class="config-field"><label>${labels[k]}</label><input type="number" min="0" max="100" data-weight="${k}" value="${v}"/><small>${k==='market'?'人工确认后触发正式评分':'系统按数据规则计算，运营可申请修正但不能直接改分'}</small></div>`).join('')}</div><div class="config-section-title">评分触发与提醒</div><div class="config-grid"><div class="config-field"><label>上架满多少天提醒评分</label><input type="number" min="1" max="180" id="remindDays" value="${state.config.remindDays}"/><small>达到天数后生成待评分提醒，不自动评分。</small></div><div class="config-field"><label>数据不足处理</label><input value="待评分 / 数据不足，不按 0 分" disabled/><small>真实成交 0 单与未同步到数据必须区分。</small></div></div>`}else if(state.configTab==='grades'){content=`<div class="alert">系统建议采购量始终限制在评级范围内；运营申请量可以越界，但必须填写原因，并由领导重点审核。</div><table class="config-table"><thead><tr><th>评级</th><th>最低分</th><th>最高分</th><th>采购最小量</th><th>采购最大量</th><th>是否进入采购</th></tr></thead><tbody>${state.config.grades.map((g,i)=>`<tr><td><strong>${g.grade}</strong></td><td><input type="number" step="0.01" data-grade="${i}" data-key="min" value="${g.min??''}" ${g.grade==='Pass'?'disabled':''}/></td><td><input type="number" step="0.01" data-grade="${i}" data-key="max" value="${g.max??''}" ${g.grade==='Pass'?'disabled':''}/></td><td><input type="number" min="0" data-grade="${i}" data-key="qtyMin" value="${g.qtyMin}" ${['D','Pass'].includes(g.grade)?'disabled':''}/></td><td><input type="number" min="0" data-grade="${i}" data-key="qtyMax" value="${g.qtyMax}" ${['D','Pass'].includes(g.grade)?'disabled':''}/></td><td>${['D','Pass'].includes(g.grade)?pill('不进入','red'):pill('允许建议','green')}</td></tr>`).join('')}</tbody></table><div class="config-section-title">数量建议算法</div><div class="config-field"><label>区间内建议策略</label><input value="按需求预测计算后，限制在等级最小 / 最大值之间" disabled/><small>Q建议 = min(评级最大量, max(评级最小量, 预测需求))。预测值无论多大或多小，都不能突破等级范围。</small></div><div class="config-section-title">评分规则待确认</div><div class="alert warning">ROI 评级上限在原表出现 0.7 与 0.8 两种口径；7.85 分示例评级也需统一。正式发布前不能静默采用冲突规则。</div>`}else if(state.configTab==='launch'){content=`<div class="alert">打品追踪从首批库存可售且 Listing 可售的日期开始。观察期不足的产品标记为观察中，不计为失败。</div><div class="config-grid"><div class="config-field"><label>打品目标观察周期（天）</label><input type="number" id="successDays" min="7" max="180" value="${state.config.successDays}"/><small>到期后根据实际数据评估打品结果。</small></div><div class="config-field"><label>目标累计销量（件）</label><input type="number" id="successQty" min="1" value="${state.config.successQty}"/><small>按配置的观察周期统计。</small></div><div class="config-field"><label>最低利润目标（CNY）</label><input type="number" id="successProfit" value="${state.config.successProfit}"/><small>必须使用已核验的利润数据。</small></div><div class="config-field"><label>ACOS 目标上限（%）</label><input type="number" id="successAcos" min="0" max="100" value="${state.config.successAcos}"/><small>与利润目标共同判断，不单独决定成功。</small></div></div><div class="config-section-title">打品结果状态</div><div class="grade-legend">${pill('等待开售','gray')}${pill('观察中','blue')}${pill('打品成功','green')}${pill('需要优化','orange')}${pill('打品失败','red')}${pill('数据不足','gray')}</div>`}else{content=`<div class="alert">规则发布后记录版本、生效时间、修改人、修改原因。旧版本评分和采购申请快照不被覆盖。</div><table class="config-table"><thead><tr><th>版本</th><th>内容</th><th>状态</th><th>生效策略</th></tr></thead><tbody><tr><td>v1.0</td><td>初始评分与采购数量范围</td><td>${pill('当前演示版本','blue')}</td><td>待确认后发布</td></tr><tr><td>v0.9</td><td>原始评分表规则</td><td>${pill('历史参考','gray')}</td><td>仅供追溯</td></tr></tbody></table>`}body.innerHTML=tabs+content+`<div class="config-section-title">本次修改原因 <span style="color:#cf1322">*</span></div><textarea class="text-area" id="configReason" placeholder="说明为什么调整评分权重、评级区间或打品目标">${esc(state.configReason)}</textarea><p class="small-note">所有配置修改必须记录原因。此 Demo 只保存到当前页面内存。</p>`;}
function handleConfigSave(){const reason=document.getElementById('configReason')?.value.trim()||'';if(!reason){toast('请填写配置修改原因');return}if(state.configTab==='weights'){const w={};document.querySelectorAll('[data-weight]').forEach(el=>w[el.dataset.weight]=Number(el.value));const sum=Object.values(w).reduce((a,b)=>a+b,0);if(sum!==100){toast(`评分权重合计必须为100%，当前为${sum}%`);return}state.config.weights=w;}else if(state.configTab==='grades'){const gs=state.config.grades.map(x=>({...x}));document.querySelectorAll('[data-grade]').forEach(el=>{const g=gs[Number(el.dataset.grade)];const k=el.dataset.key;g[k]=el.value===''?null:Number(el.value)});for(const g of gs){if(!['D','Pass'].includes(g.grade)&&(!(g.qtyMin>0)||g.qtyMax<g.qtyMin)){toast(`${g.grade}级采购数量范围无效`);return}}state.config.grades=gs;}else if(state.configTab==='launch'){state.config.remindDays=Number(document.getElementById('remindDays')?.value||state.config.remindDays);state.config.successDays=Number(document.getElementById('successDays')?.value||state.config.successDays);state.config.successQty=Number(document.getElementById('successQty')?.value||state.config.successQty);state.config.successProfit=Number(document.getElementById('successProfit')?.value||0);state.config.successAcos=Number(document.getElementById('successAcos')?.value||35)}state.configReason=reason;renderDashboard();toast('演示配置已保存，未写入真实系统');hideMask('configMask')}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.dashboard){state.dashboard=t.dataset.dashboard;state.activeMetric='all';renderDashboard()}if(t.id==='openConfig')openConfig();if(t.dataset.close)hideMask(t.dataset.close);if(t.id==='saveConfig')handleConfigSave();if(t.dataset.configTab){state.configTab=t.dataset.configTab;renderConfig()}if(t.dataset.market)openMarket(t.dataset.market);if(t.dataset.detail)openDetail(t.dataset.detail);if(t.dataset.correct)openCorrection(t.dataset.correct,t.dataset.dimension);if(t.dataset.purchase)openPurchase(t.dataset.purchase);if(t.dataset.category){state.category=t.dataset.category;renderDashboard();toast(`已筛选类目：${state.category}`)}if(t.dataset.person){state.developer=t.dataset.person;state.dashboard='new';renderDashboard()}if(t.dataset.deepDive){state.category=t.dataset.deepDive;state.dashboard='launch';renderDashboard();toast(`已筛选类目：${state.category}`)}if(t.dataset.metric){state.activeMetric=state.activeMetric===t.dataset.metric?'all':t.dataset.metric;if(t.dataset.metric==='pending'){state.dashboard='new';state.category='all'}renderDashboard();if(state.activeMetric==='pending')toast('已筛选待市场评分新品');else if(state.activeMetric==='success')toast('已筛选打品成功产品')}if(t.dataset.view==='grades')toast('等级分布明细请查看下方已完成测评表');if(t.dataset.view==='categories')toast('已展示当前类目分析结果');if(t.id==='resetFilters'){state.period='30';state.category='all';state.developer='all';state.operator='all';state.search='';state.activeMetric='all';renderDashboard()}if(t.id==='applySearch'){state.search=document.getElementById('searchInput')?.value.trim()||'';renderDashboard()}if(t.id==='toggleStat'){state.statsVisible=!state.statsVisible;renderDashboard()}if(t.id==='submitMarket'){const p=products.find(x=>x.id===state.marketId);const score=Number(document.getElementById('marketScoreInput')?.value);const reason=document.getElementById('marketReasonInput')?.value.trim()||'';if(!Number.isInteger(score)||score<0||score>10){toast('市场竞争评分必须是0–10的整数');return}if(!reason){toast('请填写市场竞争评分依据');return}p.marketScore=score;p.marketReason=reason;p.score=Number(computeScore(p,score).toFixed(2));p.grade=gradeFor(p.score);p.suggestedQty=suggestedFor(p.grade,p.demand);p.scoreStatus='待运营确认';p.purchaseStatus='待运营确认';p.correctionStatus='';hideMask('marketMask');renderDashboard();toast(`评分已计算：${p.score.toFixed(2)} 分，${p.grade}级，建议采购 ${p.suggestedQty||0} 件`)}if(t.id==='submitCorrection'){const p=products.find(x=>x.id===state.correction?.id);const dim=state.correction?.dimension;const target=Number(document.getElementById('correctionScoreInput')?.value);const reason=document.getElementById('correctionReasonInput')?.value.trim()||'';if(!Number.isInteger(target)||target<0||target>10){toast('修正分数必须是0–10的整数');return}if(!reason){toast('请填写评分修正原因');return}state.corrections.push({id:p.id,dimension:dim,requested:target,reason,status:'修正审核中'});p.correctionStatus='修正审核中';hideMask('correctionMask');renderDashboard();if(document.getElementById('detailMask').classList.contains('open'))openDetail(p.id);toast('评分修正申请已提交，原分数未改变')}if(t.id==='submitPurchase'){const p=products.find(x=>x.id===state.purchaseId);const qty=Number(document.getElementById('purchaseQtyInput')?.value);const reason=document.getElementById('purchaseReasonInput')?.value.trim()||'';if(!Number.isInteger(qty)||qty<=0){toast('采购数量必须是正整数');return}if(qty!==p.suggestedQty&&reason.length<5){toast('修改采购数量必须填写原因（至少5个字符）');return}const req={id:`PR-${Date.now().toString().slice(-6)}`,productId:p.id,quantity:qty,reason,status:'待领导审核'};state.purchaseRequests.push(req);p.purchaseStatus='待领导审核';p.requestQuantity=qty;p.requestReason=reason;p.scoreStatus='已提交采购审核';hideMask('purchaseMask');renderDashboard();toast('采购申请已提交领导审核（演示）')}if(t.id==='approvePurchase'){const req=state.purchaseRequests.find(x=>x.id===state.approvalId);const p=products.find(x=>x.id===req?.productId);if(!req||!p)return;req.status='已批准';p.purchaseStatus='已批准';p.trackingStatus='待采购';p.launchApprovedQty=req.quantity;hideMask('approvalMask');renderDashboard();toast('审核通过，已模拟生成一份正式采购计划')}if(t.id==='rejectPurchase'){const req=state.purchaseRequests.find(x=>x.id===state.approvalId);const note=document.getElementById('approvalNote')?.value.trim()||'';if(note.length<5){toast('驳回时必须填写至少5个字符的原因');return}if(req){req.status='已驳回';const p=products.find(x=>x.id===req.productId);if(p)p.purchaseStatus='审核驳回'}hideMask('approvalMask');renderDashboard();toast('申请已驳回（演示）')}if(t.dataset.approval){openApproval(t.dataset.approval)}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.filter){state[t.dataset.filter]=t.value;renderDashboard()}if(t.id==='roleView'){const leader=t.value==='leader';document.querySelectorAll('[data-approval]').forEach(b=>b.classList.toggle('hide',!leader));toast(leader?'已切换领导视角':'已切换运营视角')}});
document.addEventListener('input',e=>{if(e.target.id==='purchaseReasonInput')updatePurchaseValidation()});
document.getElementById('roleView').addEventListener('change',e=>{document.body.classList.toggle('leader-mode',e.target.value==='leader');renderDashboard()});
const observer=new MutationObserver(()=>{const leader=document.getElementById('roleView').value==='leader';document.querySelectorAll('[data-approval]').forEach(b=>b.classList.toggle('hide',!leader));});observer.observe(document.getElementById('dashboardContent'),{childList:true,subtree:true});
// Add leader-only approval actions to purchase-request records via delegated list appended in the tracking dashboard.
const oldRenderLaunch=renderLaunchDashboard;
renderLaunchDashboard=function(){let html=oldRenderLaunch();const pending=state.purchaseRequests.filter(r=>r.status==='待领导审核');if(pending.length){const rows=pending.map(r=>{const p=products.find(x=>x.id===r.productId);return `<tr><td>${esc(p.id)} · ${esc(p.name)}</td><td>${esc(p.grade)}级</td><td class="num">${r.quantity}</td><td>${pill(r.status,'orange')}</td><td class="action-cell"><button class="btn small" data-approval="${r.id}">查看审核</button></td></tr>`}).join('');html+=tablePanel('待审核采购申请',`${pending.length} 项`,[{label:'商品'},{label:'评级'},{label:'申请数量',align:'right'},{label:'状态'},{label:'操作',align:'right'}],rows,{minWidth:600});}return html};
// Ensure a leader can open approvals from the request table; role is only a visual preview in this static demo.
const originalRender=renderDashboard;
renderDashboard=function(){originalRender();const leader=document.getElementById('roleView').value==='leader';document.querySelectorAll('[data-approval]').forEach(b=>b.classList.toggle('hide',!leader));};
// Intercept filters generated in the current dashboard; select changes retain the current view.
renderDashboard();
</script>
