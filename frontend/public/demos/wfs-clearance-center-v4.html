/* configurable clearance rule center */
.rule-page{padding:17px 18px 22px;background:#fafcff}
.rule-page-intro{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:15px}
.rule-page-intro h2{margin:0 0 5px;font-size:18px;font-weight:760}
.rule-page-intro p{margin:0;color:#8593a8;font-size:11px;line-height:1.7}
.rule-steps{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.rule-step{background:#fff;border:1px solid #e3eaf4;padding:6px 10px;border-radius:7px;color:#71849a;font-size:11px}
.rule-step strong{color:#2374ed}
.rule-overview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.rule-overview>div{padding:13px 15px;border-radius:9px;border:1px solid #e4ebf5;background:#fff}
.rule-overview span{display:block;color:#8c9bb0;font-size:11px}
.rule-overview strong{display:block;font-size:23px;color:#2c3c55;margin:6px 0;font-variant-numeric:tabular-nums}
.rule-overview small{display:block;color:#94a4b6}
.rule-main{display:grid;grid-template-columns:minmax(500px,1.32fr) minmax(370px,.92fr);gap:14px;align-items:start}
.rule-edit-card,.rule-preview-card{background:#fff;border:1px solid #e3ebf5;border-radius:11px;overflow:hidden;min-width:0}
.rule-card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid #edf1f7}
.rule-card-head h3{font-size:14px;color:#263d59;margin:0}
.rule-card-head span{font-size:10px;color:#98a5b6}
.rule-group{padding:14px 16px 12px;border-bottom:1px solid #edf1f7}
.rule-group-title{font-weight:750;color:#435774;font-size:12px;margin-bottom:10px}
.rule-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px 13px}
.rule-input{border:1px solid #e5ecf4;border-radius:8px;background:#fbfcff;padding:10px 11px;min-width:0}
.rule-input label{display:block;font-size:11px;font-weight:660;color:#536987;margin-bottom:8px}
.rule-input .row-field{display:flex;align-items:center;gap:7px}
.rule-input input[type=number],.rule-input select{height:33px;border:1px solid #dce6f3;border-radius:6px;background:#fff;padding:0 9px;color:#2e435f;width:100%;min-width:0;font-weight:650}
.rule-input small{color:#94a3b6;white-space:nowrap}
.rule-toggle-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}
.rule-toggle{display:flex;align-items:center;gap:8px;font-size:11px;color:#536983;padding:5px 0}
.rule-toggle input{accent-color:#1677ff;width:15px;height:15px}
.rule-preview-card{position:sticky;top:6px}
.rule-preview-inner{padding:15px 16px}
.rule-impact{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}
.rule-impact>div{background:#f5f8fd;border:1px solid #e5ecf6;border-radius:8px;text-align:center;padding:12px 5px}

.rule-impact span{font-size:10px;color:#8696a9}

const A_COLS=[['identity','商品 ID / 品名',187],['sku','SKU / MSKU',153],['store','店铺 / 负责人',127],['risk','风险等级',95],['source','识别来源',91],['wfs','WFS 可售',86],['age','库龄',66],['coverage','售罄天数',83],['stockCost','库存成本',106],['price','售价',73],['daily','7 / 14 / 30 日均销量',120],['revenue','7 / 14 / 30 天销售额',125],['ads','7 / 14 / 30 天广告费',125],['adRate','7 / 14 / 30 天广告占比',118],['profit','7 / 14 / 30 天利润',125],['profitRate','7 / 14 / 30 天利润率',114],['returns','30 天退货率',98],['rating','评分',86],['units','7 / 14 / 30 天销量',113],['status','进度 / 状态',94],['action','操作',136]];
const M_COLS=[['id','清货申请单',155],['item','清货对象',212],['store','店铺 / 负责人',140],['source','申请来源',90],['reason','清货原因',110],['method','清货方式',156],['goal','目标清货量',100],['sold','已销售',95],['removed','移除 / 弃置',102],['progress','处理进度',136],['cost','目标库存成本',116],['due','计划截止',118],['status','任务状态',100],['submitted','提交时间',136],['action','操作',128]];
function columnMenu(){const cols=state.tab==='analysis'?A_COLS:M_COLS;return `<div class="col-menu"><h3>表格列配置</h3><div class="col-list">${cols.filter(([k])=>!['identity','sku','action','id','item'].includes(k)).map(([k,n])=>`<label><input type="checkbox" data-col="${k}" ${state.hidden.has(state.tab+':'+k)?'':'checked'}> ${n}</label>`).join('')}</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:13px"><span class="soft">识别列与操作列固定</span><button class="btn sm" data-act="resetColumns">恢复默认</button></div></div>`;}
function rowSource(x){let auto=evaluate(x).auto,man=state.manual.has(x.id);return man?`<span class="tag source-manual">${auto?'人工申请 + 风险':'运营主动申请'}</span>`:`<span class="tag source-auto">系统识别</span>`;}
function stack(x,k){return `<div class="stack">${[7,14,30].map(n=>{const p=x.per[n];let value=k==='daily'?num(p.units/n,2):k==='units'?cn(p.units):k==='revenue'?usd(p.revenue):k==='ads'?usd(p.ads):k==='adRate'?pct(p.adRate):k==='profit'?usd(p.profit):pct(p.margin);return `<em>${n}天</em><b class="${(['profit','profitRate'].includes(k)&&((k==='profit'&&p.profit<0)||(k==='profitRate'&&p.margin<0)))?'neg':''}">${value}</b>`}).join('')}</div>`;}
function analystCell(x,k){const e=evaluate(x),a=activeTask(x.id);const recent=latestTask(x.id);switch(k){case 'identity':return `<div class="item-title click" data-act="inspect" data-id="${x.id}" title="${esc(x.name)}">${esc(x.name)}</div><div class="subline mono">${esc(x.item)}</div>`;case 'sku':return `<div class="bold mono">${esc(x.sku)}</div><div class="subline mono">${esc(x.msku)}</div>`;case 'store':return `<div>${esc(x.store)}</div><div class="subline">${esc(x.owner)}</div>`;case 'risk':return `${riskTag(x)}<div class="subline">${e.business.length?'含经营异常':'库存条件触发'}</div>`;case 'source':return rowSource(x);case 'wfs':return `<div class="bold num">${cn(x.avail)} <span class="soft">件</span></div>`;case 'age':return `<span class="${x.age>=180?'bold':''}">${x.age}天</span>`;case 'coverage':return coverage(x)==null?'<span style="color:#ca7770">无法估算</span>':`<strong class="num">${cn(coverage(x))}天</strong>`;case 'stockCost':return `<span class="bold num">${usd(x.avail*x.cost)}</span>`;case 'price':return usd(x.price);case 'daily':case 'units':case 'revenue':case 'ads':case 'adRate':case 'profit':case 'profitRate':return stack(x,k);case 'returns':return `<div class="bold">${x.per[30].units? pct(x.returns/x.per[30].units*100):'—'}</div><div class="subline">${x.returns} 次 / ${x.per[30].units}单</div>`;case 'rating':return `<span class="stars">★</span><strong> ${num(x.rating,1)}</strong><div class="subline">${x.reviewCount} 条评价</div>`;case 'status':return a?statusTag(a.status):recent?.status==='done'?statusTag('done'):badge('待评估','source-auto');case 'action':return `<button class="btn linkish" data-act="inspect" data-id="${x.id}">详情</button>${a?`<button class="btn linkish" data-act="task" data-id="${a.id}">任务</button>`:x.owner===state.role?`<button class="btn linkish" data-act="applyOne" data-id="${x.id}">申请清货</button>`:''}`;default:return '—'}}
function analysisTable(){const cols=A_COLS.filter(([k])=>!state.hidden.has('analysis:'+k)),all=filtered(),page=Math.min(state.page,Math.max(1,Math.ceil(all.length/state.pageSize))),slice=all.slice((page-1)*state.pageSize,page*state.pageSize);const totalWidth=cols.reduce((s,x)=>s+x[2],0)+34;return `<div class="table-clip"><table style="min-width:${totalWidth}px"><thead><tr><th style="width:34px;min-width:34px"><input type="checkbox" id="checkAll" title="选择当页可申请商品"></th>${cols.map(([k,label,w])=>`<th style="width:${w}px;min-width:${w}px" class="${k==='identity'?'stick-left':k==='sku'?'stick-left2':k==='action'?'stick-right':''}">${label}</th>`).join('')}</tr></thead><tbody>${slice.map(x=>`<tr><td><input type="checkbox" data-select="${x.id}" ${state.selected.has(x.id)?'checked':''} ${activeTask(x.id)||x.owner!==state.role?'disabled title="仅负责人可选且不得重复提交"':''}></td>${cols.map(([k,,w])=>`<td style="width:${w}px;min-width:${w}px" class="${k==='identity'?'stick-left':k==='sku'?'stick-left2':k==='action'?'stick-right':''}">${analystCell(x,k)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${cols.length+1}"><div class="empty">${icon('search',28)}<strong>暂无符合条件的清货商品</strong><span>普通非风险商品不进入清货分析；可以通过「主动申请 SKU」直接发起申请。</span></div></td></tr>`}</tbody></table></div>${pagination(all.length,page)}`;}
function manageCell(t,k){switch(k){case 'id':return `<div class="click bold mono" data-act="task" data-id="${t.id}">${esc(t.id)}</div><div class="subline">${t.lines.length} 个 SKU</div>`;case 'item':return `<div class="item-title">${esc(stock(t.lines[0].id).name)}</div><div class="subline mono">${esc(stock(t.lines[0].id).sku)}${t.lines.length>1?' 等':''}</div>`;case 'store':return `<div>${esc(taskStore(t))}</div><div class="subline">${esc(t.owner)}</div>`;case 'source':return badge(t.source==='manual'?'运营主动':'系统识别',t.source==='manual'?'source-manual':'source-auto');case 'reason':return esc(t.reason);case 'method':return esc(t.methods.join(' / '));case 'goal':return `<strong>${cn(taskQty(t))}</strong> 件`;case 'sold':return cn(taskSold(t))+' 件';case 'removed':return cn(taskRemoved(t))+' 件';case 'progress':return `<strong>${taskProgress(t)}%</strong><div class="progress" style="margin-top:8px"><span style="width:${taskProgress(t)}%"></span></div>`;case 'cost':return `<strong>${usd(taskCost(t))}</strong>`;case 'due':return t.due;case 'status':return statusTag(t.status);case 'submitted':return t.submitted;case 'action':return `<button class="btn linkish" data-act="task" data-id="${t.id}">任务详情</button>`;default:return '—';}}
function managementTable(){const cols=M_COLS.filter(([k])=>!state.hidden.has('management:'+k)),all=filtered(),page=Math.min(state.page,Math.max(1,Math.ceil(all.length/state.pageSize))),slice=all.slice((page-1)*state.pageSize,page*state.pageSize);return `<div class="table-clip" style="max-height:calc(100vh - 380px)"><table style="min-width:${cols.reduce((s,x)=>s+x[2],0)}px"><thead><tr>${cols.map(([k,t,w])=>`<th style="width:${w}px;min-width:${w}px" class="${k==='id'?'stick-left':k==='action'?'stick-right':''}">${t}</th>`).join('')}</tr></thead><tbody>${slice.map(t=>`<tr>${cols.map(([k,,w])=>`<td style="width:${w}px;min-width:${w}px" class="${k==='id'?'stick-left':k==='action'?'stick-right':''}">${manageCell(t,k)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${cols.length}"><div class="empty">${icon('file',26)}<strong>暂无符合条件的清货申请</strong><span>清货分析页提交的申请将自动出现在这里。</span></div></td></tr>`}</tbody></table></div>${pagination(all.length,page)}`;}
function pagination(total,page){const pages=Math.max(1,Math.ceil(total/state.pageSize));return `<div class="footbar"><div>共 <b>${total}</b> 条 · ${state.pageSize} 条/页 · 仅演示数据，不触发真实清货操作</div><div class="pages"><button data-act="page" data-val="${page-1}" ${page<=1?'disabled':''}>‹</button>${Array.from({length:Math.min(pages,6)},(_,i)=>i+1).map(n=>`<button class="${n===page?'active':''}" data-act="page" data-val="${n}">${n}</button>`).join('')}<button data-act="page" data-val="${page+1}" ${page>=pages?'disabled':''}>›</button></div></div>`;}
function modalFrame(title,subtitle,body,footer='',size=''){return `<div class="shade" data-act="closeShade"><div class="modal ${size}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header class="modal-header"><div><h2>${title}</h2><p>${subtitle}</p></div><button class="modal-close" data-act="close" aria-label="关闭">${icon('x',18)}</button></header><div class="modal-body">${body}</div>${footer?`<footer class="modal-footer">${footer}</footer>`:''}</div></div>`;}
const footerCancel=`<button class="btn" data-act="close">取消</button>`;
function profile(x){return `<div class="factgrid">${[['商品 ID',x.item],['SKU',x.sku],['MSKU',x.msku],['店铺',x.store],['负责人',x.owner],['当前售价',usd(x.price)],['单位库存成本',usd(x.cost)],['预计售罄',coverage(x)==null?'无法估算':cn(coverage(x))+' 天']].map(([k,v])=>`<div class="fact"><div class="fk">${k}</div><div class="fv">${esc(v)}</div></div>`).join('')}</div>`;}
function financialMatrix(x){const keys=[['units','销量','件'],['daily','日均销量','件/天'],['revenue','销售额','USD'],['ads','广告费','USD'],['adRate','广告占比','广告费/销售额'],['profit','利润','USD'],['margin','利润率','利润/销售额']];return `<table class="compare"><thead><tr><th style="width:34%">经营指标</th><th>近7天</th><th>近14天</th><th>近30天</th></tr></thead><tbody>${keys.map(([k,l])=>`<tr><td>${l}</td>${[7,14,30].map(n=>{let p=x.per[n],val=k==='units'?cn(p.units):k==='daily'?num(p.units/n,2):k==='revenue'?usd(p.revenue):k==='ads'?usd(p.ads):k==='adRate'?pct(p.adRate):k==='profit'?usd(p.profit):pct(p.margin);let cls=(k==='profit'||k==='margin')?(p.profit<0?'neg':'pos'):'';return `<td><strong class="${cls}">${val}</strong></td>`}).join('')}</tr>`).join('')}</tbody></table>`;}
function stockKpis(x){return `<div class="detail-topkpis"><div class="detail-tile"><label>WFS可售库存</label><strong>${cn(x.avail)} <span style="font-size:11px;color:#8da0b3">件</span></strong><small>仅可售库存参与去化</small></div><div class="detail-tile"><label>预计售罄天数</label><strong>${coverage(x)==null?'无法估算':cn(coverage(x))+'天'}</strong><small>按近30天销量估算</small></div><div class="detail-tile"><label>可售库存成本</label><strong>${usd(x.avail*x.cost)}</strong><small>不是预计亏损金额</small></div><div class="detail-tile"><label>平均库龄</label><strong>${x.age} <span style="font-size:11px;color:#8da0b3">天</span></strong><small>另有库龄批次分布</small></div></div>`;}
function signalBlocks(x){const e=evaluate(x);return `<div class="signal"><strong>${e.auto?'库存清货风险：'+RISK_NAMES[e.level]:'未触发自动清货风险'}</strong>${e.reasons.map(x=>'<div>• '+esc(x)+'</div>').join('')}</div>${e.business.length?e.business.map(s=>`<div class="signal business"><strong>经营异常辅助信号</strong>${esc(s)}</div>`).join(''):`<div class="signal business">经营指标仅用于辅助判断，不将所有正常库存的亏损 SKU 自动纳入清货中心。</div>`}`;}
function skuDetail(id){const x=stock(id);if(!x)return '';const a=activeTask(id),isOwner=state.role===x.owner;const source=state.manual.has(id)?badge('运营主动申请','source-manual'):badge('系统识别','source-auto');const body=`${stockKpis(x)}<div class="cols"><div><div class="section"><div class="section-title">01 · 7 / 14 / 30 天经营分析 <span>同一数据源、同一指标口径</span></div><div class="section-body">${financialMatrix(x)}<div class="notice" style="margin-top:11px">示例定义：广告占比 = 广告花费 ÷ 销售额；利润率 = 利润 ÷ 销售额。利润为 Demo 测算值，正式系统需统一结算口径。7/14/30 天均为各自累计窗口，日均销量按对应天数计算。</div></div></div><div class="section"><div class="section-title">02 · WFS库存与商品资料 <span>库存结构与商品经营信息</span></div><div class="section-body">${profile(x)}<div style="height:1px;background:#edf1f5;margin:13px 0"></div><div class="factgrid">${[['预留库存',cn(x.res)+' 件'],['不可售库存',cn(x.bad)+' 件'],['在途库存',cn(x.inbound)+' 件'],['超过规则库龄阈值（'+state.rules.agedLotDays+'天）的批次数量',cn((x.ageLots||[]).filter(l=>l.ageDays>state.rules.agedLotDays).reduce((sum,l)=>sum+l.qty,0))+' 件'],['30天退货率',x.per[30].units?pct(x.returns/x.per[30].units*100):'—'],['30天退货次数',cn(x.returns)],['评分',num(x.rating,1)+' / 5'],['评价数量',cn(x.reviewCount)]].map(([k,v])=>`<div class="fact"><div class="fk">${k}</div><div class="fv">${esc(v)}</div></div>`).join('')}</div></div></div></div><div><div class="section"><div class="section-title">03 · 清货风险决策依据</div><div class="section-body">${signalBlocks(x)}<div class="bullet">先识别库存压力，再用利润、广告、动销等业务信号辅助排优先级。人工申请不会改写系统风险等级。</div></div></div><div class="section"><div class="section-title">04 · 当前申请与处理建议</div><div class="section-body"><div class="splitline"><span>进入来源</span><strong>${source}</strong></div><div class="splitline"><span>风险等级</span><strong>${riskTag(x)}</strong></div><div class="splitline"><span>清货任务</span><strong>${a?esc(a.id)+' · '+esc(STATUS[a.status]):'尚无进行中的申请'}</strong></div><div class="splitline"><span>负责人</span><strong>${esc(x.owner)}</strong></div><p class="section-sub">${a?'已有有效申请，不允许重复发起；可在清货管理查看执行状态。':'符合权限的负责人可基于当前数据提交清货申请；低风险商品也可以通过运营主动申请进入。'}</p>${isOwner&&!a?`<button class="btn primary" data-act="applyOne" data-id="${x.id}">${icon('file')}申请清货</button>`:''}${a?`<button class="btn tonal" data-act="task" data-id="${a.id}">查看清货任务</button>`:''}${state.manual.has(id)&&isOwner&&!a?`<button class="btn danger" style="margin-left:8px" data-act="manualRemove" data-id="${id}">移出清货候选</button>`:''}</div></div></div></div>`;const footer=`<span class="muted">自动分析与人工申请使用完全相同的 SKU 经营数据。</span><button class="btn" data-act="close">关闭</button>`;return modalFrame(`${esc(x.name)} · SKU 深度分析`,`${esc(x.sku)} / ${esc(x.msku)} · ${esc(x.store)} · ${esc(x.owner)} · ${RISK_NAMES[evaluate(x).level]}`,body,footer,'wide');}
function manualEligible(x){return x.avail>0&&x.owner===state.role&&!activeTask(x.id)}
function manualChooser(){const q=state.manualQuery.trim().toLowerCase();let list=PRODUCTS.filter(x=>state.manualStore==='all'||x.store===state.manualStore).filter(x=>!q||[x.name,x.item,x.sku,x.msku,x.store].some(v=>String(v).toLowerCase().includes(q)));const n=state.manualSelection.size;const selected=[...state.manualSelection].map(stock);const stores=new Set(selected.map(x=>x.store));const allow=n>0&&stores.size===1&&selected.every(manualEligible);
 let body=`<div class="notice" style="margin-bottom:13px">本入口可搜索<strong>全部 WFS 商品</strong>，包括未触发风险规则的正常 SKU。选中后直接填写清货申请，<strong>不会先加入候选池</strong>。一张申请只允许同一店铺的商品，且只能提交本人负责的 SKU。</div><div class="search-flex"><div class="searchwrap" style="max-width:none">${icon('search',15)}<input class="search" id="manualSearch" value="${esc(state.manualQuery)}" placeholder="搜索 SKU / MSKU / 商品ID / 品名（含低风险正常商品）"></div><select id="manualStore" class="select"><option value="all">全部店铺</option>${['美区一店','美区二店','美区三店'].map(x=>`<option ${state.manualStore===x?'selected':''}>${x}</option>`).join('')}</select></div><div style="display:flex;justify-content:space-between;margin-bottom:9px;gap:8px"><span class="muted">找到 ${list.length} 件 WFS 商品，当前身份：${esc(state.role)}</span><span class="tinybadge">已选 ${n} 个 SKU</span></div><div class="choice-results">${list.map(x=>`<label class="choice-row"><input type="checkbox" data-manual-select="${x.id}" ${state.manualSelection.has(x.id)?'checked':''} ${manualEligible(x)?'':'disabled'}><div><div class="item-title">${esc(x.name)}</div><div class="subline mono">${esc(x.sku)} · ${esc(x.item)}</div></div><div style="font-size:11px;color:#6c7c92">${esc(x.store)}<div class="subline">${esc(x.owner)}</div></div><div>${riskTag(x)}<div class="subline">可售 ${x.avail} 件</div></div><div>${activeTask(x.id)?badge('已有申请','status-pending'):!manualEligible(x)?badge('非本人负责','status-cancelled'):evaluate(x).auto?badge('系统也识别','source-auto'):badge('正常库存','source-manual')}</div></label>`).join('')||`<div class="empty">暂无符合条件的商品</div>`}</div>${n&&stores.size>1?`<div class="err" style="margin-top:11px">已选择不同店铺的 SKU，请改为同一店铺后继续。</div>`:''}`;
 return modalFrame('运营主动申请清货','选择 WFS 商品后，直接填写申请表单',body,`<span class="muted">${n?'已选 '+n+' 个 SKU':'请先选择要申请的 SKU'}</span><button class="btn" data-act="close">取消</button><button class="btn primary" data-act="manualNext" ${allow?'':'disabled'}>下一步 · 填写清货申请 ${icon('chevron',14)}</button>`);}
function startApply(ids,src='auto',editId=null){let lines,old=null;if(editId){old=state.tasks.find(t=>t.id===editId);if(!old){toast('申请不存在',true);return;}ids=old.lines.map(l=>l.id);lines=clone(old.lines)}else{lines=ids.map(id=>({id,qty:Math.max(1,Math.min(stock(id)?.avail||0,Math.floor((stock(id)?.avail||0)*.5))),sold:0,removed:0,disposed:0}));}
 if(!ids.length||ids.some(id=>!stock(id)||stock(id).owner!==state.role||stock(id).avail<=0||(!editId&&activeTask(id)))){toast('所选 SKU 不符合申请权限、库存或重复申请要求',true);return;}
 if(new Set(ids.map(id=>stock(id).store)).size!==1){toast('同一申请仅允许来自同一店铺的 SKU',true);return;}
 state.draft={lines,source:old?.source||src,reason:old?.reason||'',methods:old?.methods.slice()||[],due:old?.due||'2026-11-25',remark:old?.remark||'',editId};state.error='';state.modal={type:'apply'};renderOverlay();}
function applyForm(){const d=state.draft;if(!d)return '';const store=stock(d.lines[0].id).store;const qtysum=d.lines.reduce((s,l)=>s+(Number(l.qty)||0),0);const body=`<div class="notice" style="margin-bottom:14px">${d.source==='manual'?'人工主动申请：可以为低风险 SKU 发起清货申请，提交后直接进入统一审批工作台。':'系统识别的清货风险商品申请，提交后进入统一审批工作台。'}<br>清货计划审批通过前，不会自动改动售价、广告或 WFS 库存。</div><div class="section"><div class="section-title">01 · 申请 SKU 与清货数量 <span>同店铺 · 按 SKU 逐项填写</span></div><div class="section-body" style="padding:0"><table class="subtable"><thead><tr><th>SKU / 商品</th><th>风险</th><th>WFS可售</th><th>计划数量 <span class="req">*</span></th><th>关联库存成本</th></tr></thead><tbody>${d.lines.map((l,i)=>{const x=stock(l.id);return `<tr><td><strong>${esc(x.sku)}</strong><div class="subline">${esc(x.name)}</div></td><td>${riskTag(x)}</td><td>${cn(x.avail)} 件</td><td><input aria-label="${esc(x.sku)}申请数量" type="number" min="1" max="${x.avail}" step="1" value="${l.qty}" data-qty="${i}"></td><td>${usd(x.cost*(Number(l.qty)||0))}</td></tr>`}).join('')}</tbody></table></div></div><div class="section"><div class="section-title">02 · 清货方案 <span>申请说明必须填写</span></div><div class="section-body"><div class="fieldset"><div class="field"><label><span class="req">*</span>清货原因</label><select id="applyReason" class="ctrl"><option value="">请选择清货原因</option>${REASONS.map(r=>`<option ${r===d.reason?'selected':''}>${r}</option>`).join('')}</select></div><div class="field"><label><span class="req">*</span>计划完成日期</label><input id="applyDue" class="ctrl" type="date" min="${dateToday}" value="${d.due}"></div><div class="field full"><label><span class="req">*</span>清货方式（可多选）</label><div class="method-list">${METHODS.map(m=>`<button type="button" class="method-btn ${d.methods.includes(m)?'active':''}" data-act="method" data-val="${m}">${d.methods.includes(m)?icon('check',13):''}${m}</button>`).join('')}</div><div class="hint">WFS 移除 / 弃置属于有成本的库存处置；审批通过后仍须由明确授权的执行环节操作。</div></div><div class="field full"><label><span class="req">*</span>申请说明</label><textarea class="ctrl text" id="applyRemark" maxlength="500" placeholder="请说明为何现在需要清货、计划如何执行、主要库存及经营依据……">${esc(d.remark)}</textarea><span class="hint">不允许为空或全空格。领导审批时必须看到完整说明；补充资料不覆盖原说明。</span></div></div></div></div>${state.error?`<div class="err" id="formError" style="background:#fff5f4;border:1px solid #f4dedd;padding:11px;border-radius:7px">${esc(state.error)}</div>`:''}<div class="warning-band" style="margin-top:12px">${icon('info',16)}店铺：${esc(store)} · SKU：${d.lines.length} 个 · 清货件数：${cn(qtysum)} 件 · 申请人与审批人不能是同一人。本 Demo 不执行真实审批。</div>`;
 return modalFrame(d.editId?'补充资料并重新提交':'提交 WFS 清货申请',`${d.source==='manual'?'运营主动发起':'系统风险识别'} · ${esc(store)} · 负责人 ${esc(state.role)}`,body,`<span class="muted">将生成待审批申请 · 审批在独立工作台处理</span><button class="btn" data-act="close">取消</button><button class="btn primary" data-act="submitApply">${icon('check',14)}${d.editId?'重新提交审批':'提交申请'}</button>`,'wide');}
function submitApply(){const d=state.draft;if(!d)return;d.reason=$('applyReason')?.value||'';d.due=$('applyDue')?.value||'';d.remark=$('applyRemark')?.value||'';d.lines.forEach((l,i)=>{l.qty=Number(document.querySelector(`[data-qty="${i}"]`)?.value)});
 let error='';if(!d.reason)error='请选择清货原因';else if(!d.methods.length)error='请至少选择一种清货方式';else if(!d.due||d.due<dateToday)error='计划完成日期不得早于 2026-10-24';else if(!d.remark.trim())error='申请说明必须填写，不能留空或只输入空格';else if(d.lines.some(l=>!Number.isInteger(l.qty)||l.qty<1||l.qty>stock(l.id).avail))error='每个 SKU 的计划清货数量必须为正整数且不超过当前 WFS 可售库存';else if(new Set(d.lines.map(l=>stock(l.id).store)).size!==1)error='同一申请只能包含同一店铺的商品';
 if(error){state.error=error;renderOverlay();return;}
 if(d.editId){const t=state.tasks.find(t=>t.id===d.editId);if(!t)return;t.lines=clone(d.lines);t.reason=d.reason;t.methods=[...d.methods];t.due=d.due;t.remark=d.remark.trim();t.status='pending';t.version++;t.ruleVersion=state.ruleVersion;t.riskAtSubmission=taskRisk(t);t.submitted=dateToday+' 18:52';t.history.push({at:dateToday+' 18:52',who:state.role,text:'补充清货申请材料并重新提交审批；原申请说明版本保留在业务审计中'});}else{const n=Math.max(6,...state.tasks.map(t=>Number(t.id.split('-').pop())||0))+1;const id='CH-1024-'+String(n).padStart(3,'0');state.tasks.unshift({id,lines:clone(d.lines),status:'pending',reason:d.reason,methods:[...d.methods],owner:state.role,requester:state.role,approver:'李主管',date:dateToday,due:d.due,submitted:dateToday+' 18:52',remark:d.remark.trim(),source:d.source,history:[{at:dateToday+' 18:52',who:state.role,text:'创建正式清货申请；推送至统一审批工作台'}],version:1,ruleVersion:state.ruleVersion,riskAtSubmission:d.lines.some(l=>evaluate(stock(l.id)).level==='high')?'high':d.lines.some(l=>evaluate(stock(l.id)).level==='medium')?'medium':'low'});}
 if(d.source==='manual')d.lines.forEach(l=>state.manual.add(l.id));state.modal=null;state.draft=null;state.manualSelection.clear();state.selected.clear();state.tab='management';state.status='pending';state.query='';state.page=1;persist();render();toast('申请已提交为「待审批」；请在独立审批工作台处理。');}
function historyTimeline(t){return `<div class="timeline">${t.history.slice().reverse().map(x=>`<div class="tl"><strong>${esc(x.text)}</strong><small>${esc(x.at)} · ${esc(x.who)}</small></div>`).join('')}</div>`;}
function taskDetail(id){const t=state.tasks.find(t=>t.id===id);if(!t)return '';const p=taskProgress(t),owned=t.owner===state.role,canExecute=['ready','running','paused'].includes(t.status)&&owned,canUpdate=t.status==='running'&&owned;let total=taskQty(t);const body=`<div class="detail-topkpis"><div class="detail-tile"><label>计划清货数量</label><strong>${cn(total)} 件</strong><small>${t.lines.length} SKU · ${esc(taskStore(t))}</small></div><div class="detail-tile"><label>已销售</label><strong>${cn(taskSold(t))} 件</strong><small>销售已处理数量</small></div><div class="detail-tile"><label>已移除 / 弃置</label><strong>${cn(taskRemoved(t))} 件</strong><small>库存处置已完成数量</small></div><div class="detail-tile"><label>清货完成率</label><strong>${p}%</strong><div class="progress" style="margin-top:10px"><span style="width:${p}%"></span></div></div></div><div class="cols"><div><div class="section"><div class="section-title">01 · 清货申请 SKU 明细 <span>与清货分析使用统一数据</span></div><div class="section-body" style="padding:0"><table class="subtable"><thead><tr><th>商品 / SKU</th><th>目标量</th><th>销售</th><th>移除</th><th>弃置</th><th>完成率</th></tr></thead><tbody>${t.lines.map(l=>{const x=stock(l.id),p=Math.round((l.sold+l.removed+l.disposed)/l.qty*100);return `<tr><td><button class="btn linkish" data-act="inspect" data-id="${x.id}">${esc(x.sku)}</button><div class="subline">${esc(x.name)}</div></td><td>${l.qty}</td><td>${l.sold}</td><td>${l.removed}</td><td>${l.disposed}</td><td>${p}%</td></tr>`}).join('')}</tbody></table></div></div><div class="section"><div class="section-title">02 · 申请方案与业务说明</div><div class="section-body"><div class="factgrid">${[['清货原因',t.reason],['清货方式',t.methods.join('、')],['提交时间',t.submitted],['计划完成日期',t.due],['申请来源',t.source==='manual'?'运营主动申请':'系统风险识别'],['关联目标库存成本',usd(taskCost(t))]].map(([k,v])=>`<div class="fact"><div class="fk">${k}</div><div class="fv">${esc(v)}</div></div>`).join('')}</div><div style="margin-top:14px"><strong style="font-size:11px">申请说明（必填，保留原文）</strong><div class="notice" style="margin-top:8px;white-space:pre-wrap;word-break:break-word">${esc(t.remark)}</div></div></div></div><div class="section"><div class="section-title">03 · 操作留痕与审批流转</div><div class="section-body">${historyTimeline(t)}</div></div></div><div><div class="section"><div class="section-title">04 · 流程与操作边界</div><div class="section-body"><div class="splitline"><span>申请单号</span><strong>${esc(t.id)}</strong></div><div class="splitline"><span>审批状态 / 执行状态</span><strong>${statusTag(t.status)}</strong></div><div class="splitline"><span>申请运营</span><strong>${esc(t.requester)}</strong></div><div class="splitline"><span>审批负责人</span><strong>${esc(t.approver)}</strong></div><div class="splitline"><span>申请版本</span><strong>V${t.version}</strong></div><div class="splitline"><span>提交时规则版本</span><strong>V${t.ruleVersion||1}</strong></div><div class="notice" style="margin-top:12px">本页只接收并展示外部审批结果，不提供通过 / 驳回按钮。审批通过仅授权后续清货执行，不直接产生 Walmart 操作。</div></div></div><div class="section"><div class="section-title">05 · 清货执行</div><div class="section-body"><p class="section-sub">${owned?'当前身份为该清货申请负责人。':'当前身份不是负责人，以下执行操作不可用。'} 只有审批通过后才允许更新进度，且累计数量不可回退或超过目标。</p><div class="method-list" style="margin-top:12px">${t.status==='ready'?`<button class="btn primary" data-act="taskAction" data-id="${id}" data-val="start" ${!owned?'disabled':''}>${icon('play',13)}开始执行</button>`:''}${t.status==='running'?`<button class="btn primary" data-act="progress" data-id="${id}" ${!owned?'disabled':''}>更新进度</button><button class="btn" data-act="taskAction" data-id="${id}" data-val="pause" ${!owned?'disabled':''}>暂停执行</button><button class="btn" data-act="taskAction" data-id="${id}" data-val="finish" ${!owned||p<100?'disabled':''}>确认完成</button>`:''}${t.status==='paused'?`<button class="btn primary" data-act="taskAction" data-id="${id}" data-val="resume" ${!owned?'disabled':''}>恢复执行</button>`:''}${t.status==='pending'?`<button class="btn danger" data-act="taskAction" data-id="${id}" data-val="withdraw" ${!owned?'disabled':''}>撤回申请</button>`:''}${t.status==='supplement'?`<button class="btn primary" data-act="resubmit" data-id="${id}" ${!owned?'disabled':''}>补充资料重提</button>`:''}${t.status==='rejected'?`<button class="btn" data-act="resubmit" data-id="${id}" ${!owned?'disabled':''}>调整方案再次申请</button>`:''}${['done','cancelled'].includes(t.status)?`<span class="muted">当前任务已结束，历史记录保留。</span>`:''}</div></div></div></div></div>`;
 return modalFrame(`清货申请 · ${esc(t.id)}`,`${esc(taskStore(t))} · ${esc(t.requester)} · ${STATUS[t.status]} · 提交至统一审批工作台`,body,`<span class="muted">清货管理不重复提供审批操作</span><button class="btn" data-act="close">关闭</button>`,'wide');}
function progressModal(id){const t=state.tasks.find(t=>t.id===id);if(!t)return '';const body=`<div class="notice" style="margin-bottom:14px">只允许负责人更新已获批的执行中清货计划。下列数量是累计值，不允许减少；销售＋移除＋弃置不可超过目标数量。</div><div class="section"><div class="section-title">累计执行进度（按 SKU）</div><div class="section-body" style="padding:0"><table class="subtable"><thead><tr><th>SKU</th><th>计划数量</th><th>已销售</th><th>已移除</th><th>已弃置</th></tr></thead><tbody>${t.lines.map((l,i)=>`<tr><td>${esc(stock(l.id).sku)}</td><td>${l.qty}</td>${['sold','removed','disposed'].map(k=>`<td><input type="number" min="${l[k]}" max="${l.qty}" step="1" value="${l[k]}" data-progress="${k}" data-row="${i}"></td>`).join('')}</tr>`).join('')}</tbody></table></div></div>${state.error?`<div class="err">${esc(state.error)}</div>`:''}`;return modalFrame('更新清货执行进度',`${esc(id)} · 仅记录本地模拟数据`,body,`<span class="muted">不调用Walmart API或真实库存</span><button class="btn" data-act="close">取消</button><button class="btn primary" data-act="saveProgress">保存执行进度</button>`);}
function removeManualModal(id){const x=stock(id);return modalFrame('移出人工清货候选',`${esc(x.sku)} · ${esc(x.name)}`,`<div class="warning-band">此操作只影响清货分析候选列表，不删除清货申请历史，也不调整库存。具有有效清货任务的 SKU 不能移出。</div><div class="field" style="margin-top:17px"><label><span class="req">*</span>移出原因</label><textarea id="removeNote" class="ctrl text" placeholder="请说明不再需要人工关注该清货候选商品的原因"></textarea></div>${state.error?`<p class="err">${esc(state.error)}</p>`:''}`,`<button class="btn" data-act="close">取消</button><button class="btn danger" data-act="confirmRemove" data-id="${id}">确认移出</button>`,'narrow');}
function renderOverlay(){let m=state.modal;const e=$('overlay');if(!m){e.innerHTML='';return;}e.innerHTML=m.type==='inspect'?skuDetail(m.id):m.type==='manual'?manualChooser():m.type==='apply'?applyForm():m.type==='task'?taskDetail(m.id):m.type==='progress'?progressModal(m.id):m.type==='remove'?removeManualModal(m.id):'';}
function render(preserve=false){let scroll=preserve?$('workspace')?.scrollTop:0;$('app').innerHTML=layout();if(preserve&&$('workspace'))$('workspace').scrollTop=scroll;renderOverlay();}
function toast(text,bad=false){const d=document.createElement('div');d.className='toast'+(bad?' bad':'');d.textContent=text;$('toasts').appendChild(d);setTimeout(()=>d.remove(),3600);}
function saveProgress(){const t=state.tasks.find(t=>t.id===state.modal?.id);if(!t||t.status!=='running'||t.owner!==state.role){toast('当前没有执行权限',true);return;}const copy=clone(t.lines);document.querySelectorAll('[data-progress]').forEach(n=>{copy[Number(n.dataset.row)][n.dataset.progress]=Number(n.value)});let error='';for(let i=0;i<copy.length;i++){const l=copy[i],old=t.lines[i];if(['sold','removed','disposed'].some(k=>!Number.isInteger(l[k])||l[k]<old[k]))error='累计记录必须为整数，不能小于已记录数量';if(l.sold+l.removed+l.disposed>l.qty)error='已销售 + 已移除 + 已弃置不能超过计划清货数量';}if(error){state.error=error;renderOverlay();return;}
 t.lines=copy;t.history.push({at:dateToday+' 18:52',who:state.role,text:'更新清货执行进度：销售 '+cn(taskSold(t))+' 件；移除/弃置 '+cn(taskRemoved(t))+' 件'});state.modal={type:'task',id:t.id};state.error='';persist();render();toast('执行进度已更新（演示数据）');}
function taskAction(id,cmd){const t=state.tasks.find(t=>t.id===id),config={start:['ready','running','负责人开始执行'],pause:['running','paused','暂停执行清货计划'],resume:['paused','running','恢复执行清货计划'],withdraw:['pending','cancelled','撤回待审批清货申请'],finish:['running','done','清货目标已全部完成']};let v=config[cmd];if(!t||!v||t.owner!==state.role||t.status!==v[0]){toast('操作权限或清货状态不允许',true);return;}if(cmd==='finish'&&taskProgress(t)!==100){toast('目标未达100%，不能完成',true);return;}t.status=v[1];t.history.push({at:dateToday+' 18:52',who:state.role,text:v[2]});persist();render();toast(v[2]);}
function exportCsv(){const quote=v=>{let s=String(v??'');if(/^[=+@\-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};let headers=[],rows=[];if(state.tab==='analysis'){headers=['商品ID','品名','SKU','MSKU','店铺','负责人','风险','来源','WFS可售','库龄','售罄天数','库存成本','售价',...[7,14,30].flatMap(n=>[`${n}天日均销量`,`${n}天销售额`,`${n}天广告费`,`${n}天广告占比`,`${n}天利润`,`${n}天利润率`,`${n}天销量`]),'30天退货率','评分'];rows=filtered().map(x=>[x.item,x.name,x.sku,x.msku,x.store,x.owner,RISK_NAMES[evaluate(x).level],state.manual.has(x.id)?'运营主动申请':'系统识别',x.avail,x.age,coverage(x)??'',(x.avail*x.cost).toFixed(2),x.price,...[7,14,30].flatMap(n=>{const p=x.per[n];return [(p.units/n).toFixed(2),p.revenue,p.ads,p.adRate??'',p.profit,p.margin??'',p.units]}),x.per[30].units?x.returns/x.per[30].units*100:'',x.rating]);}else{headers=['单号','店铺','申请人','申请来源','清货原因','方式','SKU数量','目标件数','已销售','移除弃置','完成率','库存成本','状态','申请说明'];rows=filtered().map(t=>[t.id,taskStore(t),t.requester,t.source,t.reason,t.methods.join('/'),t.lines.length,taskQty(t),taskSold(t),taskRemoved(t),taskProgress(t)+'%',taskCost(t),STATUS[t.status],t.remark]);}
 const csv='\ufeff'+[headers,...rows].map(row=>row.map(quote).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=(state.tab==='analysis'?'WFS清货分析':'WFS清货管理')+'_Demo.csv';a.click();URL.revokeObjectURL(url);toast('已导出当前筛选数据（演示）');}
function action(name,el){const id=el.dataset.id,v=el.dataset.val;switch(name){case 'tab':state.tab=v;if(v==='rules')state.ruleDraft=clone(state.rules);state.page=1;state.risk='all';state.quick='all';state.status='all';state.query='';state.metric=null;state.selected.clear();state.hidden.clear();state.colOpen=false;render();break;
 case 'quick':state.quick=v;state.metric=null;state.page=1;render(true);break;
 case 'kpi':if(state.tab==='analysis'){state.quick=v==='value'?'all':v;state.risk=v==='high'?'high':'all';}else{state.status=v;}state.metric=state.metric===v?null:v;state.page=1;render(true);break;
 case 'page':state.page=Math.max(1,Number(v));render(true);break;
 case 'ruleRevert':state.ruleDraft=clone(state.rules);render();toast('已放弃草稿修改');break;
 case 'ruleDefaults':state.ruleDraft=clone(DEFAULT_RULES);render();toast('已载入默认规则草稿；点击保存后才生效');break;
 case 'ruleSave':saveRules();break;
 case 'resetFilter':state.store='all';state.owner='all';state.query='';state.risk='all';state.status='all';state.sort='risk';state.quick='all';state.metric=null;state.page=1;state.selected.clear();render(true);break;
 case 'toggleStats':state.stats=!state.stats;render(true);break;case 'columns':state.colOpen=!state.colOpen;render(true);break;case 'resetColumns':state.hidden.clear();render(true);break;
 case 'inspect':state.modal={type:'inspect',id};renderOverlay();break;case 'task':state.modal={type:'task',id};renderOverlay();break;
 case 'applyOne':startApply([id],state.manual.has(id)?'manual':'auto');break;
 case 'bulkApply':startApply([...state.selected], 'auto');break;
 case 'manualStart':state.manualSelection.clear();state.manualQuery='';state.manualStore='all';state.modal={type:'manual'};renderOverlay();break;
 case 'manualNext':startApply([...state.manualSelection],'manual');break;
 case 'method':{const d=state.draft;if(!d)return;d.methods=d.methods.includes(v)?d.methods.filter(x=>x!==v):[...d.methods,v];d.reason=$('applyReason')?.value||d.reason;d.due=$('applyDue')?.value||d.due;d.remark=$('applyRemark')?.value||d.remark;d.lines.forEach((l,i)=>{l.qty=Number(document.querySelector(`[data-qty="${i}"]`)?.value||l.qty)});state.error='';renderOverlay();break;}
 case 'submitApply':submitApply();break;
 case 'close':case 'closeShade':state.modal=null;state.draft=null;state.error='';renderOverlay();break;
 case 'rules':state.tab='rules';state.ruleDraft=clone(state.rules);state.page=1;state.modal=null;render();break;
 case 'progress':state.modal={type:'progress',id};state.error='';renderOverlay();break;
 case 'saveProgress':saveProgress();break;
 case 'taskAction':taskAction(id,v);break;
 case 'resubmit':startApply([],state.tasks.find(t=>t.id===id)?.source||'auto',id);break;
 case 'manualRemove':state.modal={type:'remove',id};state.error='';renderOverlay();break;
 case 'confirmRemove':{const x=stock(id),note=$('removeNote')?.value.trim();if(!x||x.owner!==state.role||activeTask(id)){toast('没有移出权限或存在有效申请',true);return;}if(!note){state.error='请填写移出原因';renderOverlay();return;}state.manual.delete(id);state.modal=null;persist();render();toast('已记录移出原因并移出人工候选（演示）；申请历史保留');break;}
 case 'export':exportCsv();break;
 case 'resetDemo':{if(!confirm('确认恢复演示初始数据？仅重置当前浏览器中的模拟数据。'))return;state.tasks=clone(SEED);state.manual=new Set(['WFS-110']);state.ignored.clear();state.rules=clone(DEFAULT_RULES);state.ruleDraft=null;state.ruleVersion=1;state.ruleHistory=[];state.role='刘运营';state.tab='analysis';state.store='all';state.owner='all';state.query='';state.risk='all';state.quick='all';state.status='all';state.modal=null;state.selected.clear();state.hidden.clear();state.page=1;persist();render();toast('Demo 已恢复初始数据');break;}
 }}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const name=t.dataset.act;if(name==='closeShade'&&e.target!==t)return;e.preventDefault();e.stopPropagation();action(name,t);});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.ruleBool){state.ruleDraft[t.dataset.ruleBool]=t.checked;refreshRulePreview();return;}if(t.dataset.ruleNum){state.ruleDraft[t.dataset.ruleNum]=Number(t.value);refreshRulePreview();return;}switch(t.id){case 'role':state.role=t.value;state.selected.clear();render(true);toast('当前演示运营：'+state.role);return;case 'storeSel':state.store=t.value;break;case 'ownerSel':state.owner=t.value;break;case 'riskSel':state.risk=t.value;break;case 'statusSel':state.status=t.value;break;case 'sortSel':state.sort=t.value;break;case 'manualStore':state.manualStore=t.value;renderOverlay();return;case 'checkAll':{const xs=filtered().slice((state.page-1)*state.pageSize,state.page*state.pageSize);xs.forEach(x=>{if(!activeTask(x.id)&&x.owner===state.role)t.checked?state.selected.add(x.id):state.selected.delete(x.id)});render(true);return;}}
 if(t.dataset.select){t.checked?state.selected.add(t.dataset.select):state.selected.delete(t.dataset.select);render(true);return;}
 if(t.dataset.manualSelect){t.checked?state.manualSelection.add(t.dataset.manualSelect):state.manualSelection.delete(t.dataset.manualSelect);renderOverlay();return;}
 if(t.dataset.col){t.checked?state.hidden.delete(state.tab+':'+t.dataset.col):state.hidden.add(state.tab+':'+t.dataset.col);render(true);return;}
 if(!['storeSel','ownerSel','riskSel','statusSel','sortSel'].includes(t.id))return;state.page=1;render(true);
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.ruleNum){state.ruleDraft[t.dataset.ruleNum]=t.value.trim()===''?NaN:Number(t.value);refreshRulePreview();return;}if(t.id==='searchField'){const start=t.selectionStart;state.query=t.value;state.page=1;render(true);const n=$('searchField');if(n){n.focus();n.setSelectionRange(start,start);}return;}
 if(t.id==='manualSearch'){const start=t.selectionStart;state.manualQuery=t.value;renderOverlay();const n=$('manualSearch');if(n){n.focus();n.setSelectionRange(start,start)}return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal=null;state.draft=null;state.error='';renderOverlay();}});
render();
</script></body></html>
